          type: array
          items:
            $ref: '#/components/schemas/codersdk.WorkspaceBuildParameter'
        secrets:
          description: 'Secrets sets or removes workspace secrets for this build. Previous

            secrets that are not listed carry forward unless they were ephemeral or

            a listed secret uses their env_name or file_path.'
          type: array
          items:
            $ref: '#/components/schemas/codersdk.WorkspaceSecretInput'
        state:
          type: array
          items:
            type: integer
        template_version_id:
          type: string
          format: uuid
        template_version_preset_id:
          description: TemplateVersionPresetID is the ID of the template version preset to use for the build.
          type: string
          format: uuid
        transition:
          enum:
          - start
          - stop
          - delete
          allOf:
          - $ref: '#/components/schemas/codersdk.WorkspaceTransition'
