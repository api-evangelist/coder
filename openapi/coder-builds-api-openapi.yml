    codersdk.CreateWorkspaceBuildOnSuccessRequest:
      type: object
      required:
      - transition
      properties:
        rich_parameter_values:
          description: 'RichParameterValues are applied to the child build. Parameters

            not listed here fall back to their values from the previous

            build, matching normal build behavior.'
          type: array
          items:
            $ref: '#/components/schemas/codersdk.WorkspaceBuildParameter'
        template_version_id:
          description: 'TemplateVersionID pins the child build to a specific template

            version. Pinning requires permission to update the template,

            since the active version may change before the child build

            runs. When empty, the child build uses the template''s active

            version at the time it runs.'
          type: string
          format: uuid
        template_version_preset_id:
          description: 'TemplateVersionPresetID selects a preset for the child build.

            It requires TemplateVersionID to also be set.'
          type: string
          format: uuid
        transition:
          description: 'Transition must be "start". The parent build''s transition must

            be "stop".'
          enum:
          - start
          allOf:
          - $ref: '#/components/schemas/codersdk.WorkspaceTransition'
    codersdk.ProvisionerJobStatus:
      type: string
