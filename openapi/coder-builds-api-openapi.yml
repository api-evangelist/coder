    codersdk.CreateWorkspaceBuildRequest:
      type: object
      required:
      - transition
      properties:
        dry_run:
          type: boolean
        log_level:
          description: Log level changes the default logging verbosity of a provider ("info" if empty).
          enum:
          - debug
          allOf:
          - $ref: '#/components/schemas/codersdk.ProvisionerLogLevel'
        on_success:
          description: 'OnSuccess queues a follow-up workspace build after this build succeeds.

            It currently supports restarting a workspace by starting it after a

            successful stop build.'
          allOf:
          - $ref: '#/components/schemas/codersdk.CreateWorkspaceBuildOnSuccessRequest'
        orphan:
          description: Orphan may be set for the Destroy transition.
