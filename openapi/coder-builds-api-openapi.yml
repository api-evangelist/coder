openapi: 3.2.0
info:
  description: Coderd is the service created by running coder server. It is a thin API that connects workspaces, provisioners and users. coderd stores its state in Postgres and is the only service that communicates with Postgres.
  title: Coder Builds API
  termsOfService: https://coder.com/legal/terms-of-service
  contact:
    name: API Support
    url: https://coder.com
    email: support@coder.com
  license:
    name: AGPL-3.0
    url: https://github.com/coder/coder/blob/main/LICENSE
  version: '2.0'
servers:
- url: /
tags:
- name: Builds
paths:
  /api/v2/users/{user}/workspace/{workspacename}/builds/{buildnumber}:
    get:
      tags:
      - Builds
      summary: Get workspace build by user, workspace name, and build number
      operationId: get-workspace-build-by-user-workspace-name-and-build-number
      parameters:
      - description: User ID, name, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      - description: Workspace name
        name: workspacename
        in: path
        required: true
        schema:
          type: string
      - description: Build number
        name: buildnumber
        in: path
        required: true
        schema:
          type: string
          format: number
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.WorkspaceBuild'
      security:
      - CoderSessionToken: []
  /api/v2/workspacebuilds/{workspacebuild}:
    get:
      tags:
      - Builds
      summary: Get workspace build
      operationId: get-workspace-build
      parameters:
      - description: Workspace build ID
        name: workspacebuild
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.WorkspaceBuild'
      security:
      - CoderSessionToken: []
  /api/v2/workspacebuilds/{workspacebuild}/cancel:
    patch:
      tags:
      - Builds
      summary: Cancel workspace build
      operationId: cancel-workspace-build
      parameters:
      - description: Workspace build ID
        name: workspacebuild
        in: path
        required: true
        schema:
          type: string
      - description: Expected status of the job. If expect_status is supplied, the request will be rejected with 412 Precondition Failed if the job doesn't match the state when performing the cancellation.
        name: expect_status
        in: query
        schema:
          type: string
          enum:
          - running
          - pending
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Response'
      security:
      - CoderSessionToken: []
  /api/v2/workspacebuilds/{workspacebuild}/debug-events:
    post:
      tags:
      - Builds
      summary: Report a workspace build debug click
      operationId: report-a-workspace-build-debug-click
      parameters:
      - description: Workspace build ID
        name: workspacebuild
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
      security:
      - CoderSessionToken: []
      x-apidocgen:
        skip: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.WorkspaceBuildDebugEventRequest'
        description: Debug event
        required: true
  /api/v2/workspacebuilds/{workspacebuild}/logs:
    get:
      tags:
      - Builds
      summary: Get workspace build logs
      operationId: get-workspace-build-logs
      parameters:
      - description: Workspace build ID
        name: workspacebuild
        in: path
        required: true
        schema:
          type: string
      - description: Before log id
        name: before
        in: query
        schema:
          type: integer
      - description: After log id
        name: after
        in: query
        schema:
          type: integer
      - description: Follow log stream
        name: follow
        in: query
        schema:
          type: boolean
      - description: 'Log output format. Accepted: ''json'' (default), ''text'' (plain text with RFC3339 timestamps and ANSI colors). Not supported with follow=true.'
        name: format
        in: query
        schema:
          type: string
          enum:
          - json
          - text
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/codersdk.ProvisionerJobLog'
      security:
      - CoderSessionToken: []
  /api/v2/workspacebuilds/{workspacebuild}/parameters:
    get:
      tags:
      - Builds
      summary: Get build parameters for workspace build
      operationId: get-build-parameters-for-workspace-build
      parameters:
      - description: Workspace build ID
        name: workspacebuild
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/codersdk.WorkspaceBuildParameter'
      security:
      - CoderSessionToken: []
  /api/v2/workspacebuilds/{workspacebuild}/resources:
    get:
      tags:
      - Builds
      summary: 'Removed: Get workspace resources for workspace build'
      operationId: removed-get-workspace-resources-for-workspace-build
      deprecated: true
      parameters:
      - description: Workspace build ID
        name: workspacebuild
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/codersdk.WorkspaceResource'
      security:
      - CoderSessionToken: []
  /api/v2/workspacebuilds/{workspacebuild}/secrets:
    get:
      description: 'Lists the metadata of the secrets linked to a workspace build,

        including secrets whose values a later build cleared. Values

        are never returned. env_replaces and file_replaces name the

        workspace owner''s user secrets that each live secret displaces,

        and are omitted when the caller cannot read those user secrets.'
      tags:
      - Builds
      summary: Get workspace build secrets
      operationId: get-workspace-build-secrets
      parameters:
      - description: Workspace build ID
        name: workspacebuild
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/codersdk.WorkspaceSecret'
      security:
      - CoderSessionToken: []
  /api/v2/workspacebuilds/{workspacebuild}/state:
    get:
      tags:
      - Builds
      summary: Get provisioner state for workspace build
      operationId: get-provisioner-state-for-workspace-build
      parameters:
      - description: Workspace build ID
        name: workspacebuild
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.WorkspaceBuild'
      security:
      - CoderSessionToken: []
    put:
      tags:
      - Builds
      summary: Update workspace build state
      operationId: update-workspace-build-state
      parameters:
      - description: Workspace build ID
        name: workspacebuild
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.UpdateWorkspaceBuildStateRequest'
        description: Request body
        required: true
  /api/v2/workspacebuilds/{workspacebuild}/timings:
    get:
      tags:
      - Builds
      summary: Get workspace build timings by ID
      operationId: get-workspace-build-timings-by-id
      parameters:
      - description: Workspace build ID
        name: workspacebuild
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.WorkspaceBuildTimings'
      security:
      - CoderSessionToken: []
  /api/v2/workspaces/{workspace}/builds:
    get:
      tags:
      - Builds
      summary: Get workspace builds by workspace ID
      operationId: get-workspace-builds-by-workspace-id
      parameters:
      - description: Workspace ID
        name: workspace
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - description: After ID
        name: after_id
        in: query
        schema:
          type: string
          format: uuid
      - description: Page limit
        name: limit
        in: query
        schema:
          type: integer
      - description: Page offset
        name: offset
        in: query
        schema:
          type: integer
      - description: Since timestamp
        name: since
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/codersdk.WorkspaceBuild'
      security:
      - CoderSessionToken: []
    post:
      tags:
      - Builds
      summary: Create workspace build
      operationId: create-workspace-build
      parameters:
      - description: Workspace ID
        name: workspace
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.WorkspaceBuild'
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.CreateWorkspaceBuildRequest'
        description: Create workspace build request
        required: true
components:
  schemas:
    codersdk.WorkspaceAgentLogSource:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        display_name:
          type: string
        icon:
          type: string
        id:
          type: string
          format: uuid
        workspace_agent_id:
          type: string
          format: uuid
    codersdk.AgentScriptTiming:
      type: object
      properties:
        display_name:
          type: string
        ended_at:
          type: string
          format: date-time
        exit_code:
          type: integer
        stage:
          $ref: '#/components/schemas/codersdk.TimingStage'
        started_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/codersdk.WorkspaceAgentScriptStatus'
        workspace_agent_id:
          type: string
        workspace_agent_name:
          type: string
    codersdk.ProvisionerLogLevel:
      type: string
      enum:
      - debug
      x-enum-varnames:
      - ProvisionerLogLevelDebug
    codersdk.WorkspaceAgent:
      type: object
      properties:
        api_version:
          type: string
        apps:
          type: array
          items:
            $ref: '#/components/schemas/codersdk.WorkspaceApp'
        architecture:
          type: string
        connection_timeout_seconds:
          type: integer
        created_at:
          type: string
          format: date-time
        directory:
          type: string
        disconnected_at:
          type: string
          format: date-time
        display_apps:
          type: array
          items:
            $ref: '#/components/schemas/codersdk.DisplayApp'
        environment_variables:
          type: object
          additionalProperties:
            type: string
        expanded_directory:
          type: string
        first_connected_at:
          type: string
          format: date-time
        health:
          description: Health reports the health of the agent.
          allOf:
          - $ref: '#/components/schemas/codersdk.WorkspaceAgentHealth'
        id:
          type: string
          format: uuid
        instance_id:
          type: string
        last_connected_at:
          type: string
          format: date-time
        latency:
          description: DERPLatency is mapped by region name (e.g. "New York City", "Seattle").
          type: object
          additionalProperties:
            $ref: '#/components/schemas/codersdk.DERPRegion'
        lifecycle_state:
          $ref: '#/components/schemas/codersdk.WorkspaceAgentLifecycle'
        log_sources:
          type: array
          items:
            $ref: '#/components/schemas/codersdk.WorkspaceAgentLogSource'
        logs_length:
          type: integer
        logs_overflowed:
          type: boolean
        metadata:
          description: 'Metadata is only populated on the workspaces list endpoint when the

            request opts in with the include_agent_metadata search key, and it

            only carries the requested keys. The description''s script is always

            empty here: it can be long, and list consumers want values.'
          type: array
          items:
            $ref: '#/components/schemas/codersdk.WorkspaceAgentMetadata'
        name:
          type: string
        operating_system:
          type: string
        parent_id:
          type: string
          format: uuid
        ready_at:
          type: string
          format: date-time
        resource_id:
          type: string
          format: uuid
        scripts:
          type: array
          items:
            $ref: '#/components/schemas/codersdk.WorkspaceAgentScript'
        started_at:
          type: string
          format: date-time
        startup_script_behavior:
          description: 'StartupScriptBehavior is a legacy field that is deprecated in favor

            of the `coder_script` resource. It''s only referenced by old clients.

            Deprecated: Remove in the future!'
          allOf:
          - $ref: '#/components/schemas/codersdk.WorkspaceAgentStartupScriptBehavior'
        status:
          $ref: '#/components/schemas/codersdk.WorkspaceAgentStatus'
        subsystems:
          type: array
          items:
            $ref: '#/components/schemas/codersdk.AgentSubsystem'
        troubleshooting_url:
          type: string
        updated_at:
          type: string
          format: date-time
        version:
          type: string
    codersdk.UpdateWorkspaceBuildStateRequest:
      type: object
      properties:
        state:
          type: array
          items:
            type: integer
    codersdk.WorkspaceAppHealth:
      type: string
      enum:
      - disabled
      - initializing
      - healthy
      - unhealthy
      x-enum-varnames:
      - WorkspaceAppHealthDisabled
      - WorkspaceAppHealthInitializing
      - WorkspaceAppHealthHealthy
      - WorkspaceAppHealthUnhealthy
    codersdk.ProvisionerJobType:
      type: string
      enum:
      - template_version_import
      - workspace_build
      - template_version_dry_run
      x-enum-varnames:
      - ProvisionerJobTypeTemplateVersionImport
      - ProvisionerJobTypeWorkspaceBuild
      - ProvisionerJobTypeTemplateVersionDryRun
    codersdk.WorkspaceBuild:
      type: object
      properties:
        build_number:
          type: integer
        created_at:
          type: string
          format: date-time
        daily_cost:
          type: integer
        deadline:
          type: string
          format: date-time
        has_external_agent:
          type: boolean
        id:
          type: string
          format: uuid
        initiator_id:
          type: string
          format: uuid
        initiator_name:
          type: string
        job:
          $ref: '#/components/schemas/codersdk.ProvisionerJob'
        matched_provisioners:
          $ref: '#/components/schemas/codersdk.MatchedProvisioners'
        max_deadline:
          type: string
          format: date-time
        reason:
          enum:
          - initiator
          - autostart
          - autostop
          allOf:
          - $ref: '#/components/schemas/codersdk.BuildReason'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/codersdk.WorkspaceResource'
        status:
          enum:
          - pending
          - starting
          - running
          - stopping
          - stopped
          - failed
          - canceling
          - canceled
          - deleting
          - deleted
          allOf:
          - $ref: '#/components/schemas/codersdk.WorkspaceStatus'
        template_version_id:
          type: string
          format: uuid
        template_version_name:
          type: string
        template_version_preset_id:
          type: string
          format: uuid
        transition:
          enum:
          - start
          - stop
          - delete
          allOf:
          - $ref: '#/components/schemas/codersdk.WorkspaceTransition'
        updated_at:
          type: string
          format: date-time
        workspace_id:
          type: string
          format: uuid
        workspace_name:
          type: string
        workspace_owner_avatar_url:
          type: string
        workspace_owner_id:
          type: string
          format: uuid
        workspace_owner_name:
          description: WorkspaceOwnerName is the username of the owner of the workspace.
          type: string
    codersdk.BuildReason:
      type: string
      enum:
      - initiator
      - autostart
      - autostop
      - dormancy
      - dashboard
      - cli
      - ssh_connection
      - vscode_connection
      - jetbrains_connection
      x-enum-varnames:
      - BuildReasonInitiator
      - BuildReasonAutostart
      - BuildReasonAutostop
      - BuildReasonDormancy
      - BuildReasonDashboard
      - BuildReasonCLI
      - BuildReasonSSHConnection
      - BuildReasonVSCodeConnection
      - BuildReasonJetbrainsConnection
    codersdk.WorkspaceAgentScript:
      type: object
      properties:
        cron:
          type: string
        dependencies:
          description: 'Dependencies lists the scripts this one waits for, as the

            provisioner resolved them. It is omitted when empty.'
          type: array
          items:
            $ref: '#/components/schemas/codersdk.WorkspaceAgentScriptDependency'
        display_name:
          type: string
        exit_code:
          type: integer
        id:
          type: string
          format: uuid
        log_path:
          type: string
        log_source_id:
          type: string
          format: uuid
        resource_address:
          description: 'ResourceAddress is the full Terraform address of the coder_script

            resource, for example "module.git_clone.coder_script.clone". It is

            empty for scripts that are not coder_script resources.'
          type: string
        run_on_start:
          type: boolean
        run_on_stop:
          type: boolean
        script:
          type: string
        start_blocks_login:
          type: boolean
        status:
          $ref: '#/components/schemas/codersdk.WorkspaceAgentScriptStatus'
        timeout:
          type: integer
    codersdk.MatchedProvisioners:
      type: object
      properties:
        available:
          description: 'Available is the number of provisioner daemons that are available to

            take jobs. This may be less than the count if some provisioners are

            busy or have been stopped.'
          type: integer
        count:
          description: 'Count is the number of provisioner daemons that matched the given

            tags. If the count is 0, it means no provisioner daemons matched the

            requested tags.'
          type: integer
        most_recently_seen:
          description: 'MostRecentlySeen is the most recently seen time of the set of matched

            provisioners. If no provisioners matched, this field will be null.'
          type: string
          format: date-time
    codersdk.ProvisionerJob:
      type: object
      properties:
        available_workers:
          type: array
          items:
            type: string
            format: uuid
        canceled_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        error:
          type: string
        error_code:
          enum:
          - REQUIRED_TEMPLATE_VARIABLES
          - INSUFFICIENT_QUOTA
          allOf:
          - $ref: '#/components/schemas/codersdk.JobErrorCode'
        file_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        initiator_id:
          type: string
          format: uuid
        input:
          $ref: '#/components/schemas/codersdk.ProvisionerJobInput'
        logs_overflowed:
          type: boolean
        metadata:
          $ref: '#/components/schemas/codersdk.ProvisionerJobMetadata'
        organization_id:
          type: string
          format: uuid
        queue_position:
          type: integer
        queue_size:
          type: integer
        started_at:
          type: string
          format: date-time
        status:
          enum:
          - pending
          - running
          - succeeded
          - canceling
          - canceled
          - failed
          allOf:
          - $ref: '#/components/schemas/codersdk.ProvisionerJobStatus'
        tags:
          type: object
          additionalProperties:
            type: string
        type:
          $ref: '#/components/schemas/codersdk.ProvisionerJobType'
        worker_id:
          type: string
          format: uuid
        worker_name:
          type: string
    codersdk.WorkspaceSecretInput:
      type: object
      properties:
        env_name:
          description: 'EnvName is the environment variable to inject the secret as. Empty

            means no env injection. Required when file_path is empty and value is

            set.'
          type: string
        ephemeral:
          description: 'Ephemeral secrets are delivered to this build only and are not

            carried forward to the next build.'
          type: boolean
        file_path:
          description: 'FilePath is the path to write the secret to inside the workspace.

            Empty means no file is written. Deployments may disable file path

            delivery.'
          type: string
        name:
          type: string
        value:
          description: 'Value is the plaintext secret. A null value removes the secret. An

            empty string sets an empty secret.'
          type: string
    codersdk.WorkspaceResourceMetadata:
      type: object
      properties:
        key:
          type: string
        sensitive:
          type: boolean
        value:
          type: string
    codersdk.WorkspaceAgentScriptDependency:
      type: object
      properties:
        prerequisite_resource_address:
          type: string
        requirement:
          $ref: '#/components/schemas/codersdk.WorkspaceAgentScriptDependencyRequirement'
    codersdk.WorkspaceApp:
      type: object
      properties:
        command:
          type: string
        display_name:
          description: DisplayName is a friendly name for the app.
          type: string
        external:
          description: 'External specifies whether the URL should be opened externally on

            the client or not.'
          type: boolean
        group:
          type: string
        health:
          $ref: '#/components/schemas/codersdk.WorkspaceAppHealth'
        healthcheck:
          description: Healthcheck specifies the configuration for checking app health.
          allOf:
          - $ref: '#/components/schemas/codersdk.Healthcheck'
        hidden:
          type: boolean
        icon:
          description: 'Icon is a relative path or external URL that specifies

            an icon to be displayed in the dashboard.'
          type: string
        id:
          type: string
          format: uuid
        open_in:
          $ref: '#/components/schemas/codersdk.WorkspaceAppOpenIn'
        sharing_level:
          enum:
          - owner
          - authenticated
          - organization
          - public
          allOf:
          - $ref: '#/components/schemas/codersdk.WorkspaceAppSharingLevel'
        slug:
          description: Slug is a unique identifier within the agent.
          type: string
        statuses:
          description: Statuses is a list of statuses for the app.
          type: array
          items:
            $ref: '#/components/schemas/codersdk.WorkspaceAppStatus'
        subdomain:
          description: 'Subdomain denotes whether the app should be accessed via a path on the

            `coder server` or via a hostname-based dev URL. If this is set to true

            and there is no app wildcard configured on the server, the app will not

            be accessible in the UI.'
          type: boolean
        subdomain_name:
          description: SubdomainName is the application domain exposed on the `coder server`.
          type: string
        tooltip:
          description: 'Tooltip is an optional markdown supported field that is displayed

            when hovering over workspace apps in the UI.'
          type: string
        url:
          description: 'URL is the address being proxied to inside the workspace.

            If external is specified, this will be opened on the client.'
          type: string
    codersdk.WorkspaceAgentScriptDependencyRequirement:
      type: string
      enum:
      - success
      - completion
      x-enum-varnames:
      - WorkspaceAgentScriptDependencyRequirementSuccess
      - WorkspaceAgentScriptDependencyRequirementCompletion
    codersdk.ProvisionerTiming:
      type: object
      properties:
        action:
          type: string
        ended_at:
          type: string
          format: date-time
        job_id:
          type: string
          format: uuid
        resource:
          type: string
        source:
          type: string
        stage:
          $ref: '#/components/schemas/codersdk.TimingStage'
        started_at:
          type: string
          format: date-time
    codersdk.WorkspaceResource:
      type: object
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/codersdk.WorkspaceAgent'
        created_at:
          type: string
          format: date-time
        daily_cost:
          type: integer
        hide:
          type: boolean
        icon:
          type: string
        id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        metadata:
          type: array
          items:
            $ref: '#/components/schemas/codersdk.WorkspaceResourceMetadata'
        name:
          type: string
        type:
          type: string
        workspace_transition:
