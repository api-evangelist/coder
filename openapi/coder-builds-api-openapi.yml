          - $ref: '#/components/schemas/codersdk.WorkspaceTransition'
    codersdk.WorkspaceSecret:
      type: object
      properties:
        cleared_at:
          description: 'ClearedAt is set once a later build superseded the secret and its

            value was dropped. Cleared secrets are not delivered and replace

            nothing.'
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        description:
          type: string
        enabled:
          description: 'Enabled controls whether the secret is injected into workspaces.

            Disabled secrets remain visible and editable, but are not added

            to the agent manifest, so they are not exposed as environment

            variables or written to secret files.'
          type: boolean
        env_name:
          type: string
        env_replaces:
          description: 'EnvReplaces is the ID of the workspace owner''s user secret that this

            secret displaces on env_name.'
          type: string
          format: uuid
        ephemeral:
          description: 'Ephemeral secrets are delivered to their build only and not copied to

            the next one.'
          type: boolean
        file_path:
          type: string
        file_replaces:
          description: 'FileReplaces is the ID of the workspace owner''s user secret that this

            secret displaces on file_path.'
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        name:
          type: string
        updated_at:
          type: string
          format: date-time
        workspace_build_id:
          type: string
          format: uuid
