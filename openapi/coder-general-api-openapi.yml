openapi: 3.2.0
info:
  description: Coderd is the service created by running coder server. It is a thin API that connects workspaces, provisioners and users. coderd stores its state in Postgres and is the only service that communicates with Postgres.
  title: Coder General API
  termsOfService: https://coder.com/legal/terms-of-service
  contact:
    name: API Support
    url: https://coder.com
    email: support@coder.com
  license:
    name: AGPL-3.0
    url: https://github.com/coder/coder/blob/main/LICENSE
  version: '2.0'
servers:
- url: /
tags:
- name: General
paths:
  /api/experimental/experiments/rules:
    get:
      tags:
      - General
      summary: List experiment rules
      operationId: list-experiment-rules
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/codersdk.ExperimentRuleEntry'
      security:
      - CoderSessionToken: []
      x-apidocgen:
        skip: true
  /api/experimental/experiments/rules/{experiment}:
    put:
      tags:
      - General
      summary: Update experiment rule
      operationId: update-experiment-rule
      parameters:
      - description: Experiment name
        name: experiment
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.ExperimentRule'
      security:
      - CoderSessionToken: []
      x-apidocgen:
        skip: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.PutExperimentRuleRequest'
        description: Experiment rule
        required: true
  /api/v2/:
    get:
      tags:
      - General
      summary: API root handler
      operationId: api-root-handler
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Response'
  /api/v2/buildinfo:
    get:
      tags:
      - General
      summary: Build info
      operationId: build-info
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.BuildInfoResponse'
  /api/v2/csp/reports:
    post:
      tags:
      - General
      summary: Report CSP violations
      operationId: report-csp-violations
      responses:
        '200':
          description: OK
        '413':
          description: Request body exceeds 64 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Response'
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/coderd.cspViolation'
        description: Violation report
        required: true
  /api/v2/deployment/config:
    get:
      tags:
      - General
      summary: Get deployment config
      operationId: get-deployment-config
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.DeploymentConfig'
      security:
      - CoderSessionToken: []
  /api/v2/deployment/ssh:
    get:
      tags:
      - General
      summary: SSH Config
      operationId: ssh-config
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.SSHConfigResponse'
      security:
      - CoderSessionToken: []
  /api/v2/deployment/stats:
    get:
      tags:
      - General
      summary: Get deployment stats
      operationId: get-deployment-stats
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.DeploymentStats'
      security:
      - CoderSessionToken: []
  /api/v2/deployment/user-secrets/capabilities:
    get:
      tags:
      - General
      summary: Get user secrets capabilities
      operationId: get-user-secrets-capabilities
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.UserSecretsCapabilities'
      security:
      - CoderSessionToken: []
  /api/v2/experiments:
    get:
      tags:
      - General
      summary: Get enabled experiments
      operationId: get-enabled-experiments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/codersdk.Experiment'
      security:
      - CoderSessionToken: []
  /api/v2/experiments/available:
    get:
      tags:
      - General
      summary: Get safe experiments
      operationId: get-safe-experiments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/codersdk.Experiment'
      security:
      - CoderSessionToken: []
  /api/v2/updatecheck:
    get:
      tags:
      - General
      summary: Update check
      operationId: update-check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.UpdateCheckResponse'
  /api/v2/users/{user}/keys/tokens/tokenconfig:
    get:
      tags:
      - General
      summary: Get token config
      operationId: get-token-config
      parameters:
      - description: User ID, name, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.TokenConfig'
      security:
      - CoderSessionToken: []
components:
  schemas:
    codersdk.ExternalAuthConfig:
      type: object
      properties:
        api_base_url:
          description: 'APIBaseURL is the base URL for provider REST API calls

            (e.g., "https://api.github.com" for GitHub). Derived from

            defaults when not explicitly configured.'
          type: string
        app_install_url:
          type: string
        app_installations_url:
          type: string
        auth_url:
          type: string
        client_id:
          type: string
        code_challenge_methods_supported:
          description: 'CodeChallengeMethodsSupported lists the PKCE code challenge methods

            The only one supported by Coder is "S256".'
          type: array
          items:
            type: string
        device_code_url:
          type: string
        device_flow:
          type: boolean
        display_icon:
          description: DisplayIcon is a URL to an icon to display in the UI.
          type: string
        display_name:
          description: DisplayName is shown in the UI to identify the auth config.
          type: string
        id:
          description: 'ID is a unique identifier for the auth config.

            It defaults to `type` when not provided.'
          type: string
        mcp_tool_allow_regex:
          description: 'Deprecated: Injected MCP in AI Bridge is deprecated and will be removed in a future release.'
          type: string
        mcp_tool_deny_regex:
          description: 'Deprecated: Injected MCP in AI Bridge is deprecated and will be removed in a future release.'
          type: string
        mcp_url:
          description: 'Deprecated: Injected MCP in AI Bridge is deprecated and will be removed in a future release.'
          type: string
        no_refresh:
          type: boolean
        redirect_url:
          description: 'RedirectURL is optional, defaulting to ''ACCESS_URL''. Only useful in niche

            situations where the OAuth callback domain is different from the ACCESS_URL

            domain. The path component is ignored.'
          type: string
        regex:
          description: 'Regex allows API requesters to match an auth config by

            a string (e.g. coder.com) instead of by it''s type.


            Git clone makes use of this by parsing the URL from:

            ''Username for "https://github.com":''

            And sending it to the control plane to match against the Regex.'
          type: string
        revoke_url:
          type: string
        scopes:
          type: array
          items:
            type: string
        token_url:
          type: string
        type:
          description: Type is the type of external auth config.
          type: string
        validate_url:
          type: string
    coderd.cspViolation:
      type: object
      properties:
        csp-report:
          type: object
          additionalProperties: true
    codersdk.HTTPCookieConfig:
      type: object
      properties:
        host_prefix:
          type: boolean
        same_site:
          type: string
        secure_auth_cookie:
          type: boolean
    codersdk.LinkConfig:
      type: object
      properties:
        icon:
          type: string
          enum:
          - bug
          - chat
          - docs
          - star
        location:
          type: string
          enum:
          - navbar
          - dropdown
        name:
          type: string
        target:
          type: string
    codersdk.DERP:
      type: object
      properties:
        config:
          $ref: '#/components/schemas/codersdk.DERPConfig'
        server:
          $ref: '#/components/schemas/codersdk.DERPServerConfig'
    codersdk.DERPServerConfig:
      type: object
      properties:
        enable:
          type: boolean
        region_code:
          type: string
        region_id:
          type: integer
        region_name:
          type: string
        relay_url:
          $ref: '#/components/schemas/serpent.URL'
        stun_addresses:
          type: array
          items:
            type: string
    codersdk.AIConfig:
      type: object
      properties:
        aibridge_proxy:
          $ref: '#/components/schemas/codersdk.AIBridgeProxyConfig'
        bridge:
          $ref: '#/components/schemas/codersdk.AIBridgeConfig'
        chat:
          $ref: '#/components/schemas/codersdk.ChatConfig'
    codersdk.NotificationsEmailConfig:
      type: object
      properties:
        auth:
          description: Authentication details.
          allOf:
          - $ref: '#/components/schemas/codersdk.NotificationsEmailAuthConfig'
        force_tls:
          description: ForceTLS causes a TLS connection to be attempted.
          type: boolean
        from:
          description: The sender's address.
          type: string
        hello:
          description: The hostname identifying the SMTP server.
          type: string
        smarthost:
          description: The intermediary SMTP host through which emails are sent (host:port).
          type: string
        tls:
          description: TLS details.
          allOf:
          - $ref: '#/components/schemas/codersdk.NotificationsEmailTLSConfig'
    codersdk.Experiment:
      type: string
      enum:
      - example
      - notifications
      - workspace-usage
      - mcp-server-http
      - mcp-tool-search
      - workspace-build-updates
      - no_nats_pubsub
      - workspace-capable-licensing
      - ai-gateway-seat-exclusion
      - ai-gateway-reverse-proxy
      - chat-projects
      - chat-advisor
      - chat-virtual-desktop
      - agent-lifecycle-hooks
      - chat-inline-mcp-servers
      - enable-ai-workspace-debug
      - chat-stage-metrics
      x-enum-comments:
        ExperimentAIGatewayReverseProxy: Uses stateless reverse proxy routing when MCP injection is not configured.
        ExperimentAIGatewaySeatExclusion: Excludes AI Gateway (AI Bridge) usage from AI Governance seat consumption.
        ExperimentAgentLifecycleHooks: Enables chat lifecycle hook webhooks for agent chats.
        ExperimentChatAdvisor: Enables the advisor tool for root agent chats.
        ExperimentChatInlineMCPServers: Enables inline MCP servers declared on POST /chats.
        ExperimentChatProjects: Enables organization-scoped projects that group agent chats.
        ExperimentChatStageMetrics: Exposes chat lifecycle stage durations as Prometheus metrics.
        ExperimentChatVirtualDesktop: Enables virtual desktop and computer use provider for agents.
        ExperimentEnableAIWorkspaceDebug: Enables debugging failed workspace builds with Coder Agents.
        ExperimentExample: This isn't used for anything.
        ExperimentMCPServerHTTP: Enables the MCP HTTP server functionality.
        ExperimentMCPToolSearch: Defers MCP tool schemas behind a searchable catalog in agent chats.
        ExperimentNoNATSPubsub: Disables the embedded NATS pubsub, falling back to PostgreSQL pubsub.
        ExperimentNotifications: Sends notifications via SMTP and webhooks following certain events.
        ExperimentWorkspaceBuildUpdates: Enables publishing workspace build updates to the all builds pubsub channel.
        ExperimentWorkspaceCapableLicensing: Counts only users holding the workspace-create permission toward the license seat limit.
        ExperimentWorkspaceUsage: Enables the new workspace usage tracking.
      x-enum-descriptions:
      - This isn't used for anything.
      - Sends notifications via SMTP and webhooks following certain events.
      - Enables the new workspace usage tracking.
      - Enables the MCP HTTP server functionality.
      - Defers MCP tool schemas behind a searchable catalog in agent chats.
      - Enables publishing workspace build updates to the all builds pubsub channel.
      - Disables the embedded NATS pubsub, falling back to PostgreSQL pubsub.
      - Counts only users holding the workspace-create permission toward the license seat limit.
      - Excludes AI Gateway (AI Bridge) usage from AI Governance seat consumption.
      - Uses stateless reverse proxy routing when MCP injection is not configured.
      - Enables organization-scoped projects that group agent chats.
      - Enables the advisor tool for root agent chats.
      - Enables virtual desktop and computer use provider for agents.
      - Enables chat lifecycle hook webhooks for agent chats.
      - Enables inline MCP servers declared on POST /chats.
      - Enables debugging failed workspace builds with Coder Agents.
      - Exposes chat lifecycle stage durations as Prometheus metrics.
      x-enum-varnames:
      - ExperimentExample
      - ExperimentNotifications
      - ExperimentWorkspaceUsage
      - ExperimentMCPServerHTTP
      - ExperimentMCPToolSearch
      - ExperimentWorkspaceBuildUpdates
      - ExperimentNoNATSPubsub
      - ExperimentWorkspaceCapableLicensing
      - ExperimentAIGatewaySeatExclusion
      - ExperimentAIGatewayReverseProxy
      - ExperimentChatProjects
      - ExperimentChatAdvisor
      - ExperimentChatVirtualDesktop
      - ExperimentAgentLifecycleHooks
      - ExperimentChatInlineMCPServers
      - ExperimentEnableAIWorkspaceDebug
      - ExperimentChatStageMetrics
    codersdk.SSHConfigResponse:
      type: object
      properties:
        hostname_prefix:
          description: 'HostnamePrefix is the prefix we append to workspace names for SSH hostnames.

            Deprecated: use HostnameSuffix instead.'
          type: string
        hostname_suffix:
          description: HostnameSuffix is the suffix to append to workspace names for SSH hostnames.
          type: string
        ssh_config_options:
          type: object
          additionalProperties:
            type: string
    serpent.Option:
      type: object
      properties:
        annotations:
          description: 'Annotations enable extensions to serpent higher up in the stack. It''s useful for

            help formatting and documentation generation.'
          allOf:
          - $ref: '#/components/schemas/serpent.Annotations'
        default:
          description: 'Default is parsed into Value if set.

            Must be `""` if `DefaultFn` != nil'
          type: string
        description:
          type: string
        env:
          description: 'Env is the environment variable used to configure this option. If unset,

            environment configuring is disabled.'
          type: string
        flag:
          description: 'Flag is the long name of the flag used to configure this option. If unset,

            flag configuring is disabled.'
          type: string
        flag_shorthand:
          description: 'FlagShorthand is the one-character shorthand for the flag. If unset, no

            shorthand is used.'
          type: string
        group:
          description: 'Group is a group hierarchy that helps organize this option in help, configs

            and other documentation.'
          allOf:
          - $ref: '#/components/schemas/serpent.Group'
        hidden:
          type: boolean
        name:
          type: string
        required:
          description: 'Required means this value must be set by some means. It requires

            `ValueSource != ValueSourceNone`

            If `Default` is set, then `Required` is ignored.'
          type: boolean
        use_instead:
          description: 'UseInstead is a list of options that should be used instead of this one.

            The field is used to generate a deprecation warning.'
          type: array
          items:
            $ref: '#/components/schemas/serpent.Option'
        value:
          description: Value includes the types listed in values.go.
        value_source:
          $ref: '#/components/schemas/serpent.ValueSource'
        yaml:
          description: 'YAML is the YAML key used to configure this option. If unset, YAML

            configuring is disabled.'
          type: string
    url.Userinfo:
      type: object
    serpent.Struct-array_codersdk_ExternalAuthConfig:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/codersdk.ExternalAuthConfig'
    codersdk.HealthcheckConfig:
      type: object
      properties:
        refresh:
          type: integer
        threshold_database:
          type: integer
    codersdk.SSHConfig:
      type: object
      properties:
        deploymentName:
          description: DeploymentName is the config-ssh Hostname prefix
          type: string
        sshconfigOptions:
          description: 'SSHConfigOptions are additional options to add to the ssh config file.

            This will override defaults.'
          type: array
          items:
            type: string
    serpent.Group:
      type: object
      properties:
        description:
          type: string
        name:
          type: string
        parent:
          $ref: '#/components/schemas/serpent.Group'
        yaml:
          type: string
    codersdk.UserQuietHoursScheduleConfig:
      type: object
      properties:
        allow_user_custom:
          type: boolean
        default_schedule:
          type: string
    codersdk.SwaggerConfig:
      type: object
      properties:
        enable:
          type: boolean
    codersdk.TemplateBuilderConfig:
      type: object
      properties:
        disabled:
          type: boolean
        registry_url:
          type: string
    codersdk.DeploymentStats:
      type: object
      properties:
        aggregated_from:
          description: 'AggregatedFrom is the time in which stats are aggregated from.

            This might be back in time a specific duration or interval.'
          type: string
          format: date-time
        collected_at:
          description: CollectedAt is the time in which stats are collected at.
          type: string
          format: date-time
        next_update_at:
          description: 'NextUpdateAt is the time when the next batch of stats will

            be updated.'
          type: string
          format: date-time
        session_count:
          $ref: '#/components/schemas/codersdk.SessionCountDeploymentStats'
        workspaces:
          $ref: '#/components/schemas/codersdk.WorkspaceDeploymentStats'
    codersdk.SessionCountDeploymentStats:
      type: object
      properties:
        apps:
          description: 'Apps holds one entry per reported app name, each carrying the family it

            totals under. The fields below duplicate those totals for one release.'
          type: object
          additionalProperties:
            $ref: '#/components/schemas/codersdk.SessionCountApp'
        jetbrains:
          description: 'Deprecated: total Apps by Family instead.'
          type: integer
        reconnecting_pty:
          description: 'Deprecated: total Apps by Family instead.'
          type: integer
        ssh:
          description: 'Deprecated: total Apps by Family instead.'
          type: integer
        vscode:
          description: 'Deprecated: total Apps by Family instead.'
          type: integer
    codersdk.ExperimentRule:
      type: object
      properties:
        condition:
          description: Condition is the CEL expression of a condition rule.
          type: string
        mode:
          description: 'Mode is one of the ExperimentRuleMode values, or empty when the

            stored rule is malformed. A malformed rule decides off until it is

            replaced. It is a plain string so that clients can represent the

            malformed state.'
          type: string
        revision:
          description: 'Revision increases on every change and starts at 1. Zero means the

            stored rule has no readable positive revision, so it is malformed.'
          type: integer
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          format: uuid
    codersdk.ProvisionerConfig:
      type: object
      properties:
        daemon_poll_interval:
          type: integer
        daemon_poll_jitter:
          type: integer
        daemon_psk:
          type: string
        daemon_types:
          type: array
          items:
            type: string
        daemons:
          description: Daemons is the number of built-in terraform provisioners.
          type: integer
        disable_module_cache:
          description: 'DisableModuleCache disables the reuse of Terraform modules cached at

            template import for every template in the deployment. Templates cannot

            opt back in.'
          type: boolean
        force_cancel_interval:
          type: integer
    serpent.Regexp:
      type: object
    codersdk.DERPConfig:
      type: object
      properties:
        block_direct:
          type: boolean
        force_websockets:
          type: boolean
        path:
          type: string
        url:
          type: string
    codersdk.NotificationsInboxConfig:
      type: object
      properties:
        enabled:
          type: boolean
    codersdk.DangerousConfig:
      type: object
      properties:
        allow_all_cors:
          type: boolean
        allow_path_app_sharing:
          type: boolean
        allow_path_app_site_owner_access:
          type: boolean
    codersdk.SessionCountApp:
      type: object
      properties:
        count:
          type: integer
        display_name:
          description: 'DisplayName is the registry''s name for a known app, otherwise the

            normalized identifier itself.'
          type: string
        family:
          description: Family is the group this app totals under.
          allOf:
          - $ref: '#/components/schemas/codersdk.AppFamilyName'
        icon:
          description: Icon is a bundled path under /icon/, empty if the app has none.
          type: string
    codersdk.AIBridgeProxyConfig:
      type: object
      properties:
        allowed_private_cidrs:
          type: array
          items:
            type: string
        api_dump_dir:
          type: string
        cert_file:
          type: string
        domain_allowlist:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        key_file:
          type: string
        listen_addr:
          type: string
        target:
          type: string
        tls_cert_file:
          type: string
        tls_key_file:
          type: string
        upstream_proxy:
          type: string
        upstream_proxy_ca:
          type: string
    codersdk.NotificationsEmailTLSConfig:
      type: object
      properties:
        ca_file:
          description: CAFile specifies the location of the CA certificate to use.
          type: string
        cert_file:
          description: CertFile specifies the location of the certificate to use.
          type: string
        insecure_skip_verify:
          description: InsecureSkipVerify skips target certificate validation.
          type: boolean
        key_file:
          description: KeyFile specifies the location of the key to use.
          type: string
        server_name:
          description: ServerName to verify the hostname for the targets.
          type: string
        start_tls:
          description: StartTLS attempts to upgrade plain connections to TLS.
          type: boolean
    codersdk.RateLimitConfig:
      type: object
      properties:
        api:
          type: integer
        disable_all:
          type: boolean
    codersdk.PprofConfig:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/serpent.HostPort'
        enable:
          type: boolean
    codersdk.StatsCollectionConfig:
      type: object
      properties:
        usage_stats:
          $ref: '#/components/schemas/codersdk.UsageStatsConfig'
    codersdk.UserSecretsCapabilities:
      type: object
      properties:
        file_path_delivery_enabled:
          description: 'FilePathDeliveryEnabled reports whether Coder writes stored file paths

            into workspaces. Stored paths are preserved either way.'
          type: boolean
    codersdk.PrometheusConfig:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/serpent.HostPort'
        aggregate_agent_stats_by:
          type: array
          items:
            type: string
        collect_agent_stats:
          type: boolean
        collect_db_metrics:
          type: boolean
        enable:
          type: boolean
    codersdk.RetentionConfig:
      type: object
      properties:
        api_keys:
          description: 'APIKeys controls how long expired API keys are retained before being deleted.

            Keys are only deleted if they have been expired for at least this duration.

            Defaults to 7 days to preserve existing behavior.'
          type: integer
        audit_logs:
          description: 'AuditLogs controls how long audit log entries are retained.

            Set to 0 to disable (keep indefinitely).'
          type: integer
        boundary_logs:
          description: 'BoundaryLogs controls how long boundary audit log entries are

            retained. Boundary logs record every HTTP request processed by

            a Boundary confinement proxy. Set to 0 to disable automatic

            deletion (keep indefinitely). Adjust to match your

            organization''s regulatory requirements.'
          type: integer
        connection_logs:
          description: 'ConnectionLogs controls how long connection log entries are retained.

            Set to 0 to disable (keep indefinitely).'
          type: integer
        workspace_agent_logs:
          description: 'WorkspaceAgentLogs controls how long workspace agent logs are retained.

            Logs are deleted if the agent hasn''t connected within this period.

            Logs from the latest build are always retained regardless of age.

            Defaults to 7 days to preserve existing behavior.'
          type: integer
    codersdk.SessionLifetime:
      type: object
      properties:
        default_duration:
          description: DefaultDuration is only for browser, workspace app and oauth sessions.
          type: integer
        default_token_lifetime:
          type: integer
        disable_expiry_refresh:
          description: 'DisableExpiryRefresh will disable automatically refreshing api

            keys when they are used from the api. This means the api key lifetime at

            creation is the lifetime of the api key.'
          type: boolean
        max_admin_token_lifetime:
          type: integer
        max_token_lifetime:
          type: integer
        refresh_default_duration:
          description: 'RefreshDefaultDuration is the default lifetime for OAuth2 refresh tokens.

            This should generally be longer than access token lifetimes to allow

            refreshing after access token expiry.'
          type: integer
    codersdk.OAuth2Config:
      type: object
      properties:
        github:
