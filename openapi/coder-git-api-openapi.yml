openapi: 3.2.0
info:
  description: Coderd is the service created by running coder server. It is a thin API that connects workspaces, provisioners and users. coderd stores its state in Postgres and is the only service that communicates with Postgres.
  title: Coder Git API
  termsOfService: https://coder.com/legal/terms-of-service
  contact:
    name: API Support
    url: https://coder.com
    email: support@coder.com
  license:
    name: AGPL-3.0
    url: https://github.com/coder/coder/blob/main/LICENSE
  version: '2.0'
servers:
- url: /
tags:
- name: Git
paths:
  /api/v2/external-auth:
    get:
      tags:
      - Git
      summary: Get user external auths
      operationId: get-user-external-auths
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.ExternalAuthLink'
      security:
      - CoderSessionToken: []
  /api/v2/external-auth/{externalauth}:
    get:
      tags:
      - Git
      summary: Get external auth by ID
      operationId: get-external-auth-by-id
      parameters:
      - description: Git Provider ID
        name: externalauth
        in: path
        required: true
        schema:
          type: string
          format: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.ExternalAuth'
      security:
      - CoderSessionToken: []
    delete:
      tags:
      - Git
      summary: Delete external auth user link by ID
      operationId: delete-external-auth-user-link-by-id
      parameters:
      - description: Git Provider ID
        name: externalauth
        in: path
        required: true
        schema:
          type: string
          format: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.DeleteExternalAuthByIDResponse'
      security:
      - CoderSessionToken: []
  /api/v2/external-auth/{externalauth}/device:
    get:
      tags:
      - Git
      summary: Get external auth device by ID
      operationId: get-external-auth-device-by-id
      parameters:
      - description: Git Provider ID
        name: externalauth
        in: path
        required: true
        schema:
          type: string
          format: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.ExternalAuthDevice'
      security:
      - CoderSessionToken: []
    post:
      tags:
      - Git
      summary: Post external auth device by ID
      operationId: post-external-auth-device-by-id
      parameters:
      - description: External Provider ID
        name: externalauth
        in: path
        required: true
        schema:
          type: string
          format: string
      responses:
        '204':
          description: No Content
      security:
      - CoderSessionToken: []
components:
  schemas:
    codersdk.DeleteExternalAuthByIDResponse:
      type: object
      properties:
        token_revocation_error:
          type: string
        token_revoked:
          description: TokenRevoked set to true if token revocation was attempted and was successful
          type: boolean
    codersdk.ExternalAuthDevice:
      type: object
      properties:
        device_code:
          type: string
        expires_in:
          type: integer
        interval:
          type: integer
        user_code:
          type: string
        verification_uri:
          type: string
    codersdk.ExternalAuthLink:
      type: object
      properties:
        authenticated:
          type: boolean
        created_at:
          type: string
          format: date-time
        expires:
          type: string
          format: date-time
        has_refresh_token:
          type: boolean
        provider_id:
          type: string
        updated_at:
          type: string
          format: date-time
        validate_error:
          type: string
    codersdk.ExternalAuthUser:
      type: object
      properties:
        avatar_url:
          type: string
        id:
          type: integer
        login:
          type: string
        name:
          type: string
        profile_url:
          type: string
    codersdk.ExternalAuthAppInstallation:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/codersdk.ExternalAuthUser'
        configure_url:
          type: string
        id:
          type: integer
    codersdk.ExternalAuth:
      type: object
      properties:
        app_install_url:
          description: AppInstallURL is the URL to install the app.
          type: string
        app_installable:
          description: AppInstallable is true if the request for app installs was successful.
          type: boolean
        authenticated:
          type: boolean
        device:
          type: boolean
        display_name:
          type: string
        installations:
          description: AppInstallations are the installations that the user has access to.
          type: array
          items:
            $ref: '#/components/schemas/codersdk.ExternalAuthAppInstallation'
        supports_revocation:
          type: boolean
        user:
          description: User is the user that authenticated with the provider.
          allOf:
          - $ref: '#/components/schemas/codersdk.ExternalAuthUser'
  securitySchemes:
    AIGatewayKey:
      type: apiKey
      name: X-AI-Governance-Gateway-Key
      in: header
    Authorization:
      type: apiKey
      name: Authorization
      in: header
    CoderSessionToken:
      type: apiKey
      name: Coder-Session-Token
      in: header
x-provenance:
  method: harvested
  publisher: Coder
  source: https://raw.githubusercontent.com/coder/coder/main/coderd/apidoc/swagger.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
