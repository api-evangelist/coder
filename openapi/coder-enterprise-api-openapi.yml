          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.AgentFirewallSession'
      security:
      - CoderSessionToken: []
  /api/v2/agent-firewall/sessions/{id}/logs:
    get:
      tags:
      - Enterprise
      summary: Get agent firewall session logs
      operationId: get-agent-firewall-session-logs
      parameters:
      - description: Agent firewall session ID
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - description: Inclusive lower bound on sequence number
        name: seq_after
        in: query
        schema:
          type: integer
      - description: Exclusive upper bound on sequence number
        name: seq_before
        in: query
        schema:
          type: integer
      - description: Maximum number of logs to return (default 100)
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.AgentFirewallSessionLogsResponse'
      security:
      - CoderSessionToken: []
  /api/v2/ai-gateway/keys:
