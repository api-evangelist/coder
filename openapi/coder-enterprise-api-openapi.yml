openapi: 3.2.0
info:
  description: Coderd is the service created by running coder server. It is a thin API that connects workspaces, provisioners and users. coderd stores its state in Postgres and is the only service that communicates with Postgres.
  title: Coder Enterprise API
  termsOfService: https://coder.com/legal/terms-of-service
  contact:
    name: API Support
    url: https://coder.com
    email: support@coder.com
  license:
    name: AGPL-3.0
    url: https://github.com/coder/coder/blob/main/LICENSE
  version: '2.0'
servers:
- url: /
tags:
- name: Enterprise
paths:
  /.well-known/oauth-authorization-server:
    get:
      tags:
      - Enterprise
      summary: OAuth2 authorization server metadata
      operationId: oauth2-authorization-server-metadata
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.OAuth2AuthorizationServerMetadata'
  /.well-known/oauth-protected-resource:
    get:
      tags:
      - Enterprise
      summary: OAuth2 protected resource metadata
      operationId: oauth2-protected-resource-metadata
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.OAuth2ProtectedResourceMetadata'
  /api/experimental/ai/model-prices:
    get:
      tags:
      - Enterprise
      summary: List AI model prices
      operationId: list-ai-model-prices
      parameters:
      - description: Only return prices for this provider
        name: provider
        in: query
        schema:
          type: string
      - description: Only return prices for this model
        name: model
        in: query
        schema:
          type: string
      - description: Only return prices from this source, or all to return every price a model holds
        name: source
        in: query
        schema:
          type: string
          enum:
          - default
          - custom
          - all
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/codersdk.AIModelPrice'
      security:
      - CoderSessionToken: []
      x-apidocgen:
        skip: true
    post:
      tags:
      - Enterprise
      summary: Upsert AI model prices
      operationId: upsert-ai-model-prices
      responses:
        '204':
          description: No Content
      security:
      - CoderSessionToken: []
      x-apidocgen:
        skip: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.UpsertAIModelPricesRequest'
        description: Prices to set
        required: true
  /api/experimental/organizations/{organization}/ai/spend/users:
    get:
      description: 'Returns one page of per-user AI spend for the organization, most expensive first, built from the same raw AI Gateway token usage as the CSV export so the two reconcile. Each user lists the providers and clients they spent through, and the response carries the user count, total spend, and unpriced usage count over every matching user.

        The optional period_start and period_end query parameters bound the period and are interpreted as UTC. They must be provided together and span at most 31 days. When both are omitted, the current UTC monthly period is used.

        An explicit period_start must fall within the configured AI Gateway data retention window, since older token usage is purged. The default period is narrowed to that window instead. The response echoes the applied bounds and, when retention is enabled, the start of the retention window.

        The optional provider_name, model, and client query parameters restrict the spend report to usage matching all supplied filters. Use client=Unknown for usage with an unknown or missing client.

        Unknown query parameters are rejected.

        Requires organization-level administrator permissions.'
      tags:
      - Enterprise
      summary: List organization AI spend by user
      operationId: list-organization-ai-spend-by-user
      parameters:
      - description: Organization ID
        name: organization
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - description: Inclusive lower bound (RFC3339)
        name: period_start
        in: query
        schema:
          type: string
          format: date-time
      - description: Exclusive upper bound (RFC3339)
        name: period_end
        in: query
        schema:
          type: string
          format: date-time
      - description: Only include usage through this provider configuration name
        name: provider_name
        in: query
        schema:
          type: string
      - description: Only include usage of this model
        name: model
        in: query
        schema:
          type: string
      - description: Only include usage from this client. Unknown matches usage without a recorded client.
        name: client
        in: query
        schema:
          type: string
      - description: Page size (default 10, maximum 100)
        name: limit
        in: query
        schema:
          type: integer
      - description: Page offset
        name: offset
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.OrganizationAISpendReport'
      security:
      - CoderSessionToken: []
      x-apidocgen:
        skip: true
  /api/v2/agent-firewall/sessions/{id}:
    get:
      tags:
      - Enterprise
      summary: Get agent firewall session by ID
      operationId: get-agent-firewall-session-by-id
