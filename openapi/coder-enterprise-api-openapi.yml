    post:
      tags:
      - Enterprise
      summary: Create AI Gateway key
      operationId: create-ai-gateway-key
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.CreateAIGatewayKeyResponse'
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.CreateAIGatewayKeyRequest'
        description: Create AI Gateway key request
        required: true
  /api/v2/ai-gateway/keys/{key}:
    delete:
      tags:
