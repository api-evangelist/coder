          format: uuid
        name:
          type: string
        redirect_uris:
          description: RedirectURIs are the app's registered redirect URIs, primary first.
          type: array
          items:
            type: string
        scope:
          description: 'Scope is the space-separated list of scopes this app''s tokens may be

            granted. Empty means unrestricted. A non-empty value with no names is a

            configured allowlist that grants nothing.'
          type: string
    codersdk.GroupMemberAISpend:
