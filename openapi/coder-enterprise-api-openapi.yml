      summary: Delete AI Gateway key
      operationId: delete-ai-gateway-key
      parameters:
      - description: Key ID
        name: key
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
      security:
      - CoderSessionToken: []
  /api/v2/ai-gateway/serve:
    get:
      tags:
      - Enterprise
      summary: AI Gateway serve
      operationId: ai-gateway-serve
      responses:
        '101':
          description: Switching Protocols
      security:
