  /api/v2/groups/{group}/members/ai/spend:
    get:
      description: 'Returns aggregate AI spend attributed to the group per requested user.

        A maximum of 100 user IDs may be requested per call, and requests with more are rejected, so callers are expected to batch across multiple requests.

        User IDs that are not members of the group, or that the caller has no read access to, are silently omitted.'
      tags:
      - Enterprise
      summary: Get group members AI spend
      operationId: get-group-members-ai-spend
      parameters:
      - description: Group ID
        name: group
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - description: Comma-separated list of user IDs (maximum 100)
        name: user_ids
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.GroupMembersAISpend'
      security:
      - CoderSessionToken: []
  /api/v2/licenses:
