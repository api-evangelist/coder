      summary: Get user login type
      operationId: get-user-login-type
      parameters:
      - description: User ID, name, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.UserLoginType'
      security:
