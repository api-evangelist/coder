  /api/v2/users/{user}/roles:
    get:
      tags:
      - Users
      summary: Get user roles
      operationId: get-user-roles
      parameters:
      - description: User ID, name, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.User'
