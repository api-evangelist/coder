openapi: 3.2.0
info:
  description: Coderd is the service created by running coder server. It is a thin API that connects workspaces, provisioners and users. coderd stores its state in Postgres and is the only service that communicates with Postgres.
  title: Coder Users API
  termsOfService: https://coder.com/legal/terms-of-service
  contact:
    name: API Support
    url: https://coder.com
    email: support@coder.com
  license:
    name: AGPL-3.0
    url: https://github.com/coder/coder/blob/main/LICENSE
  version: '2.0'
servers:
- url: /
tags:
- name: Users
paths:
  /api/experimental/users/email:
    put:
      tags:
      - Users
      summary: Update user email
      operationId: update-user-email-experimental
      responses:
        '204':
          description: No Content
      security:
      - CoderSessionToken: []
      x-apidocgen:
        skip: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.UpdateUserEmailRequest'
        description: Update email request
        required: true
  /api/experimental/users/{user}/skills:
    get:
      tags:
      - Users
      summary: List user skills
      operationId: list-user-skills
      parameters:
      - description: User ID, username, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/codersdk.SkillMetadata'
      security:
      - CoderSessionToken: []
      x-apidocgen:
        skip: true
    post:
      tags:
      - Users
      summary: Create a user skill
      operationId: create-a-user-skill
      parameters:
      - description: User ID, username, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Skill'
      security:
      - CoderSessionToken: []
      x-apidocgen:
        skip: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.CreateSkillRequest'
        description: Create user skill request
        required: true
  /api/experimental/users/{user}/skills/{skillName}:
    get:
      tags:
      - Users
      summary: Get a user skill by name
      operationId: get-a-user-skill-by-name
      parameters:
      - description: User ID, username, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      - description: Skill name
        name: skillName
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Skill'
      security:
      - CoderSessionToken: []
      x-apidocgen:
        skip: true
    delete:
      tags:
      - Users
      summary: Delete a user skill
      operationId: delete-a-user-skill
      parameters:
      - description: User ID, username, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      - description: Skill name
        name: skillName
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
      security:
      - CoderSessionToken: []
      x-apidocgen:
        skip: true
    patch:
      tags:
      - Users
      summary: Update a user skill
      operationId: update-a-user-skill
      parameters:
      - description: User ID, username, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      - description: Skill name
        name: skillName
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Skill'
      security:
      - CoderSessionToken: []
      x-apidocgen:
        skip: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.UpdateSkillRequest'
        description: Update user skill request
        required: true
  /api/v2/users:
    get:
      tags:
      - Users
      summary: Get users
      operationId: get-users
      parameters:
      - description: Search query
        name: q
        in: query
        schema:
          type: string
      - description: After ID
        name: after_id
        in: query
        schema:
          type: string
          format: uuid
      - description: Page limit
        name: limit
        in: query
        schema:
          type: integer
      - description: Page offset
        name: offset
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.GetUsersResponse'
      security:
      - CoderSessionToken: []
    post:
      tags:
      - Users
      summary: Create new user
      operationId: create-new-user
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.User'
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.CreateUserRequest'
        description: Create user request
        required: true
  /api/v2/users/authmethods:
    get:
      tags:
