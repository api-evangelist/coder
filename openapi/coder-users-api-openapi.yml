        required: true
  /api/v2/users/{user}/status/activate:
    put:
      tags:
      - Users
      summary: Activate user account
      operationId: activate-user-account
      parameters:
      - description: User ID, name, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.User'
      security:
      - CoderSessionToken: []
  /api/v2/users/{user}/status/suspend:
    put:
      tags:
      - Users
      summary: Suspend user account
      operationId: suspend-user-account
      parameters:
      - description: User ID, name, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.User'
      security:
      - CoderSessionToken: []
components:
  schemas:
    codersdk.GitSSHKey:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        public_key:
          description: 'PublicKey is the SSH public key in OpenSSH format.

            Example: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID3OmYJvT7q1cF1azbybYy0OZ9yrXfA+M6Lr4vzX5zlp\n"

            Note: The key includes a trailing newline (\n).'
          type: string
        updated_at:
          type: string
          format: date-time
        user_id:
          type: string
          format: uuid
    codersdk.AgentChatSendShortcut:
      type: string
      enum:
      - enter
      - modifier_enter
      x-enum-varnames:
      - AgentChatSendShortcutEnter
      - AgentChatSendShortcutModifierEnter
    codersdk.CreateTokenRequest:
      type: object
      properties:
        allow_list:
          type: array
          items:
            $ref: '#/components/schemas/codersdk.APIAllowListTarget'
        lifetime:
          type: integer
        scope:
          description: 'Deprecated: use Scopes instead.'
          allOf:
          - $ref: '#/components/schemas/codersdk.APIKeyScope'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/codersdk.APIKeyScope'
        token_name:
          type: string
    codersdk.UpdateRoles:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
    codersdk.UpdateUserEmailRequest:
      type: object
      required:
      - new_email
      - old_email
      properties:
        new_email:
          type: string
          format: email
        old_email:
          type: string
          format: email
    codersdk.UpdateSkillRequest:
      type: object
      properties:
        content:
          description: 'Content must be SKILL.md-format Markdown with YAML frontmatter. The

            frontmatter must include name, may include description, and must be

            followed by a non-empty body.'
          type: string
        enabled:
          type: boolean
    codersdk.AgentDisplayMode:
      type: string
      enum:
      - auto
      - always_expanded
      - always_collapsed
      x-enum-varnames:
      - AgentDisplayModeAuto
      - AgentDisplayModeAlwaysExpanded
      - AgentDisplayModeAlwaysCollapsed
    codersdk.APIKeyScope:
      type: string
      enum:
      - all
      - application_connect
