      type: object
      required:
      - username
      properties:
        avatar_url:
          description: 'AvatarURL is only applied for users whose login type is password or

            none. For other login types the avatar is synced from the identity

            provider on login, so a submitted value is ignored.'
          type: string
          format: uri
        name:
          type: string
        username:
          type: string
    codersdk.UserPreferenceSettings:
      type: object
      properties:
        agent_chat_send_shortcut:
          $ref: '#/components/schemas/codersdk.AgentChatSendShortcut'
