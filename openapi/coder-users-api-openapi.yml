  /api/v2/users/oidc/callback:
    get:
      tags:
      - Users
      summary: OpenID Connect Callback
      operationId: openid-connect-callback
      responses:
        '307':
          description: Temporary Redirect
      security:
      - CoderSessionToken: []
  /api/v2/users/{user}:
    get:
      tags:
      - Users
      summary: Get user by name
      operationId: get-user-by-name
      parameters:
      - description: User ID, username, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.User'
      security:
      - CoderSessionToken: []
    delete:
      tags:
      - Users
      summary: Delete user
      operationId: delete-user
      parameters:
      - description: User ID, name, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      security:
      - CoderSessionToken: []
  /api/v2/users/{user}/appearance:
    get:
      tags:
      - Users
      summary: Get user appearance settings
      operationId: get-user-appearance-settings
      parameters:
      - description: User ID, name, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.UserAppearanceSettings'
      security:
      - CoderSessionToken: []
    put:
      tags:
      - Users
      summary: Update user appearance settings
      operationId: update-user-appearance-settings
      parameters:
      - description: User ID, name, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.UserAppearanceSettings'
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.UpdateUserAppearanceSettingsRequest'
        description: New appearance settings
        required: true
  /api/v2/users/{user}/gitsshkey:
    get:
      tags:
      - Users
      summary: Get user Git SSH key
      operationId: get-user-git-ssh-key
      parameters:
      - description: User ID, name, or me
