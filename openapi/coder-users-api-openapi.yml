      summary: Get authentication methods
      operationId: get-authentication-methods
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.AuthMethods'
      security:
      - CoderSessionToken: []
  /api/v2/users/first:
    get:
      tags:
      - Users
      summary: Check initial user created
      operationId: check-initial-user-created
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Response'
      security:
      - CoderSessionToken: []
    post:
      tags:
      - Users
      summary: Create initial user
      operationId: create-initial-user
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.CreateFirstUserResponse'
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.CreateFirstUserRequest'
        description: First user request
        required: true
  /api/v2/users/logout:
    post:
      tags:
      - Users
      summary: Log out user
      operationId: log-out-user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Response'
      security:
      - CoderSessionToken: []
  /api/v2/users/oauth2/github/callback:
    get:
      tags:
      - Users
      summary: OAuth 2.0 GitHub Callback
      operationId: oauth-20-github-callback
      responses:
        '307':
          description: Temporary Redirect
      security:
      - CoderSessionToken: []
  /api/v2/users/oauth2/github/device:
    get:
