      security:
      - CoderSessionToken: []
    put:
      tags:
      - Users
      summary: Regenerate user SSH key
      operationId: regenerate-user-ssh-key
      parameters:
      - description: User ID, name, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.GitSSHKey'
      security:
      - CoderSessionToken: []
  /api/v2/users/{user}/keys:
    post:
      tags:
      - Users
      summary: Create new session key
      operationId: create-new-session-key
      parameters:
      - description: User ID, name, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.GenerateAPIKeyResponse'
      security:
      - CoderSessionToken: []
  /api/v2/users/{user}/keys/tokens:
    get:
      tags:
      - Users
      summary: Get user tokens
      operationId: get-user-tokens
      parameters:
      - description: User ID, name, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      - description: Include expired tokens in the list
        name: include_expired
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/codersdk.APIKey'
      security:
      - CoderSessionToken: []
    post:
      tags:
      - Users
      summary: Create token API key
      operationId: create-token-api-key
      parameters:
      - description: User ID, name, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.GenerateAPIKeyResponse'
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.CreateTokenRequest'
        description: Create token request
        required: true
  /api/v2/users/{user}/keys/tokens/{keyname}:
    get:
      tags:
      - Users
      summary: Get API key by token name
      operationId: get-api-key-by-token-name
      parameters:
      - description: User ID, name, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      - description: Key Name
        name: keyname
        in: path
        required: true
        schema:
          type: string
          format: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.APIKey'
      security:
      - CoderSessionToken: []
  /api/v2/users/{user}/keys/{keyid}:
    get:
      tags:
      - Users
      summary: Get API key by ID
      operationId: get-api-key-by-id
      parameters:
      - description: User ID, name, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      - description: Key ID
        name: keyid
        in: path
        required: true
        schema:
          type: string
          format: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.APIKey'
      security:
      - CoderSessionToken: []
    delete:
      tags:
      - Users
      summary: Delete API key
      operationId: delete-api-key
      parameters:
      - description: User ID, name, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      - description: Key ID
        name: keyid
        in: path
        required: true
        schema:
          type: string
          format: string
      responses:
        '204':
          description: No Content
      security:
      - CoderSessionToken: []
  /api/v2/users/{user}/keys/{keyid}/expire:
    put:
      tags:
      - Users
      summary: Expire API key
      operationId: expire-api-key
      parameters:
      - description: User ID, name, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      - description: Key ID
        name: keyid
        in: path
        required: true
        schema:
          type: string
          format: string
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Response'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Response'
      security:
      - CoderSessionToken: []
  /api/v2/users/{user}/login-type:
    get:
      tags:
