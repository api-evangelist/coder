openapi: 3.2.0
info:
  description: Coderd is the service created by running coder server. It is a thin API that connects workspaces, provisioners and users. coderd stores its state in Postgres and is the only service that communicates with Postgres.
  title: Coder Workspaces API
  termsOfService: https://coder.com/legal/terms-of-service
  contact:
    name: API Support
    url: https://coder.com
    email: support@coder.com
  license:
    name: AGPL-3.0
    url: https://github.com/coder/coder/blob/main/LICENSE
  version: '2.0'
servers:
- url: /
tags:
- name: Workspaces
paths:
  /api/experimental/watch-all-workspacebuilds:
    get:
      tags:
      - Workspaces
      summary: Watch all workspace builds
      operationId: watch-all-workspace-builds
      responses:
        '101':
          description: Switching Protocols
      security:
      - CoderSessionToken: []
      x-apidocgen:
        skip: true
  /api/v2/organizations/{organization}/members/{user}/workspaces:
    post:
      description: 'Create a new workspace using a template. The request must

        specify either the Template ID or the Template Version ID,

        not both. If the Template ID is specified, the active version

        of the template will be used.'
      tags:
      - Workspaces
      summary: Create user workspace by organization
      operationId: create-user-workspace-by-organization
      deprecated: true
      parameters:
      - description: Organization ID
        name: organization
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - description: Username, UUID, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Workspace'
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.CreateWorkspaceRequest'
        description: Create workspace request
        required: true
  /api/v2/organizations/{organization}/members/{user}/workspaces/available-users:
    get:
      tags:
      - Workspaces
      summary: Get users available for workspace creation
      operationId: get-users-available-for-workspace-creation
      parameters:
      - description: Organization ID
        name: organization
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - description: User ID, name, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      - description: Search query
        name: q
        in: query
        schema:
          type: string
      - description: Limit results
        name: limit
        in: query
        schema:
          type: integer
      - description: Offset for pagination
        name: offset
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/codersdk.MinimalUser'
      security:
      - CoderSessionToken: []
  /api/v2/users/{user}/workspace/{workspacename}:
    get:
      tags:
      - Workspaces
      summary: Get workspace metadata by user and workspace name
      operationId: get-workspace-metadata-by-user-and-workspace-name
      parameters:
      - description: User ID, name, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      - description: Workspace name
        name: workspacename
        in: path
        required: true
        schema:
          type: string
      - description: Return data instead of HTTP 404 if the workspace is deleted
        name: include_deleted
        in: query
        schema:
          type: boolean
      - description: Comma-separated list of related data to include (e.g. `template,latest_build.resources.agents.*`). Omit to include everything.
        name: include_related
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Workspace'
      security:
      - CoderSessionToken: []
  /api/v2/users/{user}/workspaces:
    post:
      description: 'Create a new workspace using a template. The request must

        specify either the Template ID or the Template Version ID,

        not both. If the Template ID is specified, the active version

        of the template will be used.'
      tags:
      - Workspaces
      summary: Create user workspace
      operationId: create-user-workspace
      parameters:
      - description: Username, UUID, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Workspace'
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.CreateWorkspaceRequest'
        description: Create workspace request
        required: true
  /api/v2/workspaces:
    get:
      tags:
      - Workspaces
      summary: List workspaces
      operationId: list-workspaces
      parameters:
      - description: 'Search query in the format `key:value`. Available keys are: owner, template, name, status, has-agent, dormant, last_used_after, last_used_before, has_external_agent, healthy, include_agent_metadata (expands each agent with the named metadata keys rather than filtering; repeat the key for multiple items).'
        name: q
        in: query
        schema:
          type: string
      - description: Page limit
        name: limit
        in: query
        schema:
          type: integer
      - description: Page offset
        name: offset
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.WorkspacesResponse'
      security:
      - CoderSessionToken: []
  /api/v2/workspaces/{workspace}:
    get:
      tags:
      - Workspaces
      summary: Get workspace metadata by ID
      operationId: get-workspace-metadata-by-id
      parameters:
      - description: Workspace ID
        name: workspace
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - description: Return data instead of HTTP 404 if the workspace is deleted
        name: include_deleted
        in: query
        schema:
          type: boolean
      - description: Comma-separated list of related data to include (e.g. `template,latest_build.resources.agents.*`). Omit to include everything.
        name: include_related
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Workspace'
      security:
      - CoderSessionToken: []
    patch:
      tags:
      - Workspaces
      summary: Update workspace metadata by ID
      operationId: update-workspace-metadata-by-id
      parameters:
      - description: Workspace ID
        name: workspace
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.UpdateWorkspaceRequest'
        description: Metadata update request
        required: true
  /api/v2/workspaces/{workspace}/acl:
    get:
      tags:
      - Workspaces
      summary: Get workspace ACLs
      operationId: get-workspace-acls
      parameters:
      - description: Workspace ID
        name: workspace
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.WorkspaceACL'
      security:
      - CoderSessionToken: []
    delete:
      tags:
      - Workspaces
      summary: Completely clears the workspace's user and group ACLs
      operationId: completely-clears-the-workspaces-user-and-group-acls
      parameters:
      - description: Workspace ID
        name: workspace
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
      security:
      - CoderSessionToken: []
    patch:
      tags:
      - Workspaces
      summary: Update workspace ACL
      operationId: update-workspace-acl
      parameters:
      - description: Workspace ID
        name: workspace
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.UpdateWorkspaceACL'
        description: Update workspace ACL request
        required: true
  /api/v2/workspaces/{workspace}/agent-connection-watch:
    get:
      tags:
      - Workspaces
      summary: Workspace Agent Connection Watch
      operationId: workspace-agent-connection-watch
      parameters:
      - description: Workspace ID
        name: workspace
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '101':
          description: Switching Protocols
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workspacesdk.ConnectionWatchEvent'
      security:
      - CoderSessionToken: []
  /api/v2/workspaces/{workspace}/autostart:
    put:
      tags:
      - Workspaces
      summary: Update workspace autostart schedule by ID
      operationId: update-workspace-autostart-schedule-by-id
      parameters:
      - description: Workspace ID
        name: workspace
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.UpdateWorkspaceAutostartRequest'
        description: Schedule update request
        required: true
  /api/v2/workspaces/{workspace}/autoupdates:
    put:
      tags:
      - Workspaces
      summary: Update workspace automatic updates by ID
      operationId: update-workspace-automatic-updates-by-id
      parameters:
      - description: Workspace ID
        name: workspace
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.UpdateWorkspaceAutomaticUpdatesRequest'
        description: Automatic updates request
        required: true
  /api/v2/workspaces/{workspace}/dormant:
    put:
      tags:
      - Workspaces
      summary: Update workspace dormancy status by id
      operationId: update-workspace-dormancy-status-by-id
      parameters:
      - description: Workspace ID
        name: workspace
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Workspace'
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.UpdateWorkspaceDormancy'
        description: Make a workspace dormant or active
        required: true
  /api/v2/workspaces/{workspace}/extend:
    put:
      tags:
      - Workspaces
      summary: Extend workspace deadline by ID
      operationId: extend-workspace-deadline-by-id
      parameters:
      - description: Workspace ID
        name: workspace
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Response'
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.PutExtendWorkspaceRequest'
        description: Extend deadline update request
        required: true
  /api/v2/workspaces/{workspace}/favorite:
    put:
      tags:
      - Workspaces
      summary: Favorite workspace by ID
      operationId: favorite-workspace-by-id
      parameters:
      - description: Workspace ID
        name: workspace
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
      security:
      - CoderSessionToken: []
    delete:
      tags:
      - Workspaces
      summary: Unfavorite workspace by ID
      operationId: unfavorite-workspace-by-id
      parameters:
      - description: Workspace ID
        name: workspace
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
      security:
      - CoderSessionToken: []
  /api/v2/workspaces/{workspace}/resolve-autostart:
    get:
      tags:
      - Workspaces
      summary: Resolve workspace autostart by id
      operationId: resolve-workspace-autostart-by-id
      parameters:
      - description: Workspace ID
        name: workspace
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.ResolveAutostartResponse'
      security:
      - CoderSessionToken: []
  /api/v2/workspaces/{workspace}/timings:
    get:
      tags:
      - Workspaces
      summary: Get workspace timings by ID
      operationId: get-workspace-timings-by-id
      parameters:
      - description: Workspace ID
        name: workspace
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.WorkspaceBuildTimings'
      security:
      - CoderSessionToken: []
  /api/v2/workspaces/{workspace}/ttl:
    put:
      tags:
      - Workspaces
      summary: Update workspace TTL by ID
      operationId: update-workspace-ttl-by-id
      parameters:
      - description: Workspace ID
        name: workspace
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.UpdateWorkspaceTTLRequest'
        description: Workspace TTL update request
        required: true
  /api/v2/workspaces/{workspace}/usage:
    post:
      tags:
      - Workspaces
      summary: Post Workspace Usage by ID
      operationId: post-workspace-usage-by-id
      parameters:
      - description: Workspace ID
        name: workspace
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.PostWorkspaceUsageRequest'
        description: Post workspace usage request
  /api/v2/workspaces/{workspace}/watch:
    get:
      tags:
      - Workspaces
      summary: Watch workspace by ID
      operationId: watch-workspace-by-id
      deprecated: true
      parameters:
      - description: Workspace ID
        name: workspace
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/codersdk.Response'
      security:
      - CoderSessionToken: []
  /api/v2/workspaces/{workspace}/watch-ws:
    get:
      tags:
      - Workspaces
      summary: Watch workspace by ID via WebSockets
      operationId: watch-workspace-by-id-via-websockets
      parameters:
      - description: Workspace ID
        name: workspace
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.ServerSentEvent'
      security:
      - CoderSessionToken: []
components:
  schemas:
    codersdk.WorkspaceAgentLogSource:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        display_name:
          type: string
        icon:
          type: string
        id:
          type: string
          format: uuid
        workspace_agent_id:
          type: string
          format: uuid
    codersdk.MatchedProvisioners:
      type: object
      properties:
        available:
          description: 'Available is the number of provisioner daemons that are available to

            take jobs. This may be less than the count if some provisioners are

            busy or have been stopped.'
          type: integer
        count:
          description: 'Count is the number of provisioner daemons that matched the given

            tags. If the count is 0, it means no provisioner daemons matched the

            requested tags.'
          type: integer
        most_recently_seen:
          description: 'MostRecentlySeen is the most recently seen time of the set of matched

            provisioners. If no provisioners matched, this field will be null.'
          type: string
          format: date-time
    codersdk.WorkspaceApp:
      type: object
      properties:
        command:
          type: string
        display_name:
          description: DisplayName is a friendly name for the app.
          type: string
        external:
          description: 'External specifies whether the URL should be opened externally on

            the client or not.'
          type: boolean
        group:
          type: string
        health:
          $ref: '#/components/schemas/codersdk.WorkspaceAppHealth'
        healthcheck:
          description: Healthcheck specifies the configuration for checking app health.
          allOf:
          - $ref: '#/components/schemas/codersdk.Healthcheck'
        hidden:
          type: boolean
        icon:
          description: 'Icon is a relative path or external URL that specifies

            an icon to be displayed in the dashboard.'
          type: string
        id:
          type: string
          format: uuid
        open_in:
          $ref: '#/components/schemas/codersdk.WorkspaceAppOpenIn'
        sharing_level:
          enum:
          - owner
          - authenticated
          - organization
          - public
          allOf:
          - $ref: '#/components/schemas/codersdk.WorkspaceAppSharingLevel'
        slug:
          description: Slug is a unique identifier within the agent.
          type: string
        statuses:
          description: Statuses is a list of statuses for the app.
          type: array
          items:
            $ref: '#/components/schemas/codersdk.WorkspaceAppStatus'
        subdomain:
          description: 'Subdomain denotes whether the app should be accessed via a path on the

            `coder server` or via a hostname-based dev URL. If this is set to true

            and there is no app wildcard configured on the server, the app will not

            be accessible in the UI.'
          type: boolean
        subdomain_name:
          description: SubdomainName is the application domain exposed on the `coder server`.
          type: string
        tooltip:
          description: 'Tooltip is an optional markdown supported field that is displayed

            when hovering over workspace apps in the UI.'
          type: string
        url:
          description: 'URL is the address being proxied to inside the workspace.

            If external is specified, this will be opened on the client.'
          type: string
    codersdk.Workspace:
      type: object
      properties:
        allow_renames:
          description: 'AllowRenames is the effective rename permission for this workspace,

            derived from the template''s allow_workspace_renames setting and the

            deprecated deployment-wide flag.'
          type: boolean
        automatic_updates:
          enum:
          - always
          - never
          allOf:
          - $ref: '#/components/schemas/codersdk.AutomaticUpdates'
        autostart_schedule:
          type: string
        created_at:
          type: string
          format: date-time
        deleting_at:
          description: 'DeletingAt indicates the time at which the workspace will be permanently deleted.

            A workspace is eligible for deletion if it is dormant (a non-nil dormant_at value)

            and a value has been specified for time_til_dormant_autodelete on its template.'
          type: string
          format: date-time
        dormant_at:
          description: 'DormantAt being non-nil indicates a workspace that is dormant.

            A dormant workspace is no longer accessible must be activated.

            It is subject to deletion if it breaches

            the duration of the time_til_ field on its template.'
          type: string
          format: date-time
        favorite:
          type: boolean
        health:
          description: 'Health shows the health of the workspace and information about

            what is causing an unhealthy status.'
          allOf:
          - $ref: '#/components/schemas/codersdk.WorkspaceHealth'
        id:
          type: string
          format: uuid
        is_prebuild:
          description: 'IsPrebuild indicates whether the workspace is a prebuilt workspace.

            Prebuilt workspaces are owned by the prebuilds system user and have specific behavior,

            such as being managed differently from regular workspaces.

            Once a prebuilt workspace is claimed by a user, it transitions to a regular workspace,

            and IsPrebuild returns false.'
          type: boolean
        last_used_at:
          type: string
          format: date-time
        latest_app_status:
          $ref: '#/components/schemas/codersdk.WorkspaceAppStatus'
        latest_build:
          $ref: '#/components/schemas/codersdk.WorkspaceBuild'
        name:
          type: string
        next_start_at:
          type: string
          format: date-time
        organization_id:
          type: string
          format: uuid
        organization_name:
          type: string
        outdated:
          type: boolean
        owner_avatar_url:
          type: string
        owner_id:
          type: string
          format: uuid
        owner_name:
          description: OwnerName is the username of the owner of the workspace.
          type: string
        shared_with:
          type: array
          items:
            $ref: '#/components/schemas/codersdk.SharedWorkspaceActor'
        template_active_version_id:
          type: string
          format: uuid
        template_allow_user_cancel_workspace_jobs:
          type: boolean
        template_display_name:
          type: string
        template_icon:
          type: string
        template_id:
          type: string
          format: uuid
        template_name:
          type: string
        template_require_active_version:
          type: boolean
        template_use_classic_parameter_flow:
          type: boolean
        ttl_ms:
          type: integer
        updated_at:
          type: string
          format: date-time
    codersdk.AgentSubsystem:
      type: string
      enum:
      - envbox
      - envbuilder
      - exectrace
      x-enum-varnames:
      - AgentSubsystemEnvbox
      - AgentSubsystemEnvbuilder
      - AgentSubsystemExectrace
    codersdk.WorkspaceHealth:
      type: object
      properties:
        failing_agents:
          description: FailingAgents lists the IDs of the agents that are failing, if any.
          type: array
          items:
            type: string
            format: uuid
        healthy:
          description: Healthy is true if the workspace is healthy.
          type: boolean
          example: false
    codersdk.ProvisionerJobInput:
      type: object
      properties:
        error:
          type: string
        template_version_id:
          type: string
          format: uuid
        workspace_build_id:
          type: string
          format: uuid
    codersdk.WorkspaceAgentStatus:
      type: string
      enum:
      - connecting
      - connected
      - disconnected
      - timeout
      x-enum-varnames:
      - WorkspaceAgentConnecting
      - WorkspaceAgentConnected
      - WorkspaceAgentDisconnected
      - WorkspaceAgentTimeout
    codersdk.WorkspaceAppStatus:
      type: object
      properties:
        agent_id:
          type: string
          format: uuid
        app_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        icon:
          description: 'Deprecated: This field is unused and will be removed in a future version.

            Icon is an external URL to an icon that will be rendered in the UI.'
          type: string
        id:
          type: string
          format: uuid
        message:
          type: string
        needs_user_attention:
          description: 'Deprecated: This field is unused and will be removed in a future version.

            NeedsUserAttention specifies whether the status needs user attention.'
          type: boolean
        state:
          $ref: '#/components/schemas/codersdk.WorkspaceAppStatusState'
        uri:
          description: 'URI is the URI of the resource that the status is for.

            e.g. https://github.com/org/repo/pull/123

            e.g. file:///path/to/file'
          type: string
        workspace_id:
          type: string
          format: uuid
    codersdk.ProvisionerJobMetadata:
      type: object
      properties:
        template_display_name:
          type: string
        template_icon:
          type: string
        template_id:
          type: string
          format: uuid
        template_name:
          type: string
        template_version_name:
          type: string
        workspace_build_transition:
          $ref: '#/components/schemas/codersdk.WorkspaceTransition'
        workspace_id:
          type: string
          format: uuid
        workspace_name:
          type: string
    codersdk.ValidationError:
      type: object
      required:
