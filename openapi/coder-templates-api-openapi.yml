openapi: 3.2.0
info:
  description: Coderd is the service created by running coder server. It is a thin API that connects workspaces, provisioners and users. coderd stores its state in Postgres and is the only service that communicates with Postgres.
  title: Coder Templates API
  termsOfService: https://coder.com/legal/terms-of-service
  contact:
    name: API Support
    url: https://coder.com
    email: support@coder.com
  license:
    name: AGPL-3.0
    url: https://github.com/coder/coder/blob/main/LICENSE
  version: '2.0'
servers:
- url: /
tags:
- name: Templates
paths:
  /api/v2/organizations/{organization}/templates:
    get:
      description: 'Returns a list of templates for the specified organization.

        By default, only non-deprecated templates are returned.

        To include deprecated templates, specify `deprecated:true` in the search query.'
      tags:
      - Templates
      summary: Get templates by organization
      operationId: get-templates-by-organization
      parameters:
      - description: Organization ID
        name: organization
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/codersdk.Template'
      security:
      - CoderSessionToken: []
    post:
      tags:
      - Templates
      summary: Create template by organization
      operationId: create-template-by-organization
      parameters:
      - description: Organization ID
        name: organization
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Template'
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.CreateTemplateRequest'
        description: Request body
        required: true
  /api/v2/organizations/{organization}/templates/examples:
    get:
      tags:
      - Templates
      summary: Get template examples by organization
      operationId: get-template-examples-by-organization
      deprecated: true
      parameters:
      - description: Organization ID
        name: organization
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/codersdk.TemplateExample'
      security:
      - CoderSessionToken: []
  /api/v2/organizations/{organization}/templates/{templatename}:
    get:
      tags:
      - Templates
      summary: Get templates by organization and template name
      operationId: get-templates-by-organization-and-template-name
      parameters:
      - description: Organization ID
        name: organization
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - description: Template name
        name: templatename
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Template'
      security:
      - CoderSessionToken: []
  /api/v2/organizations/{organization}/templates/{templatename}/versions/{templateversionname}:
    get:
      tags:
      - Templates
      summary: Get template version by organization, template, and name
      operationId: get-template-version-by-organization-template-and-name
      parameters:
      - description: Organization ID
        name: organization
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - description: Template name
        name: templatename
        in: path
        required: true
        schema:
          type: string
      - description: Template version name
        name: templateversionname
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.TemplateVersion'
      security:
      - CoderSessionToken: []
  /api/v2/organizations/{organization}/templates/{templatename}/versions/{templateversionname}/previous:
    get:
      tags:
      - Templates
      summary: Get previous template version by organization, template, and name
      operationId: get-previous-template-version-by-organization-template-and-name
      parameters:
      - description: Organization ID
        name: organization
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - description: Template name
        name: templatename
        in: path
        required: true
        schema:
          type: string
      - description: Template version name
        name: templateversionname
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.TemplateVersion'
        '204':
          description: No Content
      security:
      - CoderSessionToken: []
  /api/v2/organizations/{organization}/templateversions:
    post:
      tags:
      - Templates
      summary: Create template version by organization
      operationId: create-template-version-by-organization
      parameters:
      - description: Organization ID
        name: organization
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.TemplateVersion'
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.CreateTemplateVersionRequest'
        description: Create template version request
        required: true
  /api/v2/templates:
    get:
      description: 'Returns a list of templates.

        By default, only non-deprecated templates are returned.

        To include deprecated templates, specify `deprecated:true` in the search query.'
      tags:
      - Templates
      summary: Get all templates
      operationId: get-all-templates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/codersdk.Template'
      security:
      - CoderSessionToken: []
  /api/v2/templates/examples:
    get:
      tags:
      - Templates
      summary: Get template examples
      operationId: get-template-examples
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/codersdk.TemplateExample'
      security:
      - CoderSessionToken: []
  /api/v2/templates/{template}:
    get:
      tags:
      - Templates
      summary: Get template settings by ID
      operationId: get-template-settings-by-id
      parameters:
      - description: Template ID
        name: template
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Template'
      security:
      - CoderSessionToken: []
    delete:
      tags:
      - Templates
      summary: Delete template by ID
      operationId: delete-template-by-id
      parameters:
      - description: Template ID
        name: template
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Response'
      security:
      - CoderSessionToken: []
    patch:
      tags:
      - Templates
      summary: Update template settings by ID
      operationId: update-template-settings-by-id
      parameters:
      - description: Template ID
        name: template
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Template'
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.UpdateTemplateMeta'
        description: Patch template settings request
        required: true
  /api/v2/templates/{template}/daus:
    get:
      tags:
      - Templates
      summary: Get template DAUs by ID
      operationId: get-template-daus-by-id
      parameters:
      - description: Template ID
        name: template
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.DAUsResponse'
      security:
      - CoderSessionToken: []
  /api/v2/templates/{template}/versions:
    get:
      tags:
      - Templates
      summary: List template versions by template ID
      operationId: list-template-versions-by-template-id
      parameters:
      - description: Template ID
        name: template
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - description: After ID
        name: after_id
        in: query
        schema:
          type: string
          format: uuid
      - description: Include archived versions in the list
        name: include_archived
        in: query
        schema:
          type: boolean
      - description: Page limit
        name: limit
        in: query
        schema:
          type: integer
      - description: Page offset
        name: offset
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/codersdk.TemplateVersion'
      security:
      - CoderSessionToken: []
    patch:
      tags:
      - Templates
      summary: Update active template version by template ID
      operationId: update-active-template-version-by-template-id
      parameters:
      - description: Template ID
        name: template
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Response'
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.UpdateActiveTemplateVersion'
        description: Modified template version
        required: true
  /api/v2/templates/{template}/versions/archive:
    post:
      tags:
      - Templates
      summary: Archive template unused versions by template id
      operationId: archive-template-unused-versions-by-template-id
      parameters:
      - description: Template ID
        name: template
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Response'
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.ArchiveTemplateVersionsRequest'
        description: Archive request
        required: true
  /api/v2/templates/{template}/versions/{templateversionname}:
    get:
      tags:
      - Templates
      summary: Get template version by template ID and name
      operationId: get-template-version-by-template-id-and-name
      parameters:
      - description: Template ID
        name: template
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - description: Template version name
        name: templateversionname
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/codersdk.TemplateVersion'
      security:
      - CoderSessionToken: []
  /api/v2/templateversions/{templateversion}:
    get:
      tags:
      - Templates
      summary: Get template version by ID
      operationId: get-template-version-by-id
      parameters:
      - description: Template version ID
        name: templateversion
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.TemplateVersion'
      security:
      - CoderSessionToken: []
    patch:
      tags:
      - Templates
      summary: Patch template version by ID
      operationId: patch-template-version-by-id
      parameters:
      - description: Template version ID
        name: templateversion
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.TemplateVersion'
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.PatchTemplateVersionRequest'
        description: Patch template version request
        required: true
  /api/v2/templateversions/{templateversion}/archive:
    post:
      tags:
      - Templates
      summary: Archive template version
      operationId: archive-template-version
      parameters:
      - description: Template version ID
        name: templateversion
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Response'
      security:
      - CoderSessionToken: []
  /api/v2/templateversions/{templateversion}/cancel:
    patch:
      tags:
      - Templates
      summary: Cancel template version by ID
      operationId: cancel-template-version-by-id
      parameters:
      - description: Template version ID
        name: templateversion
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Response'
      security:
      - CoderSessionToken: []
  /api/v2/templateversions/{templateversion}/dry-run:
    post:
      tags:
      - Templates
      summary: Create template version dry-run
      operationId: create-template-version-dry-run
      parameters:
      - description: Template version ID
        name: templateversion
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.ProvisionerJob'
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.CreateTemplateVersionDryRunRequest'
        description: Dry-run request
        required: true
  /api/v2/templateversions/{templateversion}/dry-run/{jobID}:
    get:
      tags:
      - Templates
      summary: Get template version dry-run by job ID
      operationId: get-template-version-dry-run-by-job-id
      parameters:
      - description: Template version ID
        name: templateversion
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - description: Job ID
        name: jobID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.ProvisionerJob'
      security:
      - CoderSessionToken: []
  /api/v2/templateversions/{templateversion}/dry-run/{jobID}/cancel:
    patch:
      tags:
      - Templates
      summary: Cancel template version dry-run by job ID
      operationId: cancel-template-version-dry-run-by-job-id
      parameters:
      - description: Job ID
        name: jobID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - description: Template version ID
        name: templateversion
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.Response'
      security:
      - CoderSessionToken: []
  /api/v2/templateversions/{templateversion}/dry-run/{jobID}/logs:
    get:
      tags:
      - Templates
      summary: Get template version dry-run logs by job ID
      operationId: get-template-version-dry-run-logs-by-job-id
      parameters:
      - description: Template version ID
        name: templateversion
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - description: Job ID
        name: jobID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - description: Before Unix timestamp
        name: before
        in: query
        schema:
          type: integer
      - description: After Unix timestamp
        name: after
        in: query
        schema:
          type: integer
      - description: Follow log stream
        name: follow
        in: query
        schema:
          type: boolean
      - description: 'Log output format. Accepted: ''json'' (default), ''text'' (plain text with RFC3339 timestamps and ANSI colors). Not supported with follow=true.'
        name: format
        in: query
        schema:
          type: string
          enum:
          - json
          - text
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/codersdk.ProvisionerJobLog'
      security:
      - CoderSessionToken: []
  /api/v2/templateversions/{templateversion}/dry-run/{jobID}/matched-provisioners:
    get:
      tags:
      - Templates
      summary: Get template version dry-run matched provisioners
      operationId: get-template-version-dry-run-matched-provisioners
      parameters:
      - description: Template version ID
        name: templateversion
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - description: Job ID
        name: jobID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.MatchedProvisioners'
      security:
      - CoderSessionToken: []
  /api/v2/templateversions/{templateversion}/dry-run/{jobID}/resources:
    get:
      tags:
      - Templates
      summary: Get template version dry-run resources by job ID
      operationId: get-template-version-dry-run-resources-by-job-id
      parameters:
      - description: Template version ID
        name: templateversion
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - description: Job ID
        name: jobID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/codersdk.WorkspaceResource'
      security:
      - CoderSessionToken: []
  /api/v2/templateversions/{templateversion}/dynamic-parameters:
    get:
      tags:
      - Templates
      summary: Open dynamic parameters WebSocket by template version
      operationId: open-dynamic-parameters-websocket-by-template-version
      parameters:
      - description: Template version ID
        name: templateversion
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '101':
          description: Switching Protocols
      security:
      - CoderSessionToken: []
  /api/v2/templateversions/{templateversion}/dynamic-parameters/evaluate:
    post:
      tags:
      - Templates
      summary: Evaluate dynamic parameters for template version
      operationId: evaluate-dynamic-parameters-for-template-version
      parameters:
      - description: Template version ID
        name: templateversion
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.DynamicParametersResponse'
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.DynamicParametersRequest'
        description: Initial parameter values
        required: true
  /api/v2/templateversions/{templateversion}/external-auth:
    get:
      tags:
      - Templates
      summary: Get external auth by template version
      operationId: get-external-auth-by-template-version
      parameters:
      - description: Template version ID
        name: templateversion
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - description: Owner to report external auth state for. Defaults to the requesting user.
        name: user_id
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/codersdk.TemplateVersionExternalAuth'
      security:
      - CoderSessionToken: []
  /api/v2/templateversions/{templateversion}/logs:
    get:
      tags:
      - Templates
      summary: Get logs by template version
      operationId: get-logs-by-template-version
      parameters:
      - description: Template version ID
        name: templateversion
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - description: Before log id
        name: before
        in: query
        schema:
          type: integer
      - description: After log id
        name: after
        in: query
        schema:
          type: integer
      - description: Follow log stream
        name: follow
        in: query
        schema:
          type: boolean
      - description: 'Log output format. Accepted: ''json'' (default), ''text'' (plain text with RFC3339 timestamps and ANSI colors). Not supported with follow=true.'
        name: format
        in: query
        schema:
          type: string
          enum:
          - json
          - text
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/codersdk.ProvisionerJobLog'
      security:
      - CoderSessionToken: []
  /api/v2/templateversions/{templateversion}/parameters:
    get:
      tags:
      - Templates
      summary: 'Removed: Get parameters by template version'
      operationId: removed-get-parameters-by-template-version
      parameters:
      - description: Template version ID
        name: templateversion
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
      security:
      - CoderSessionToken: []
  /api/v2/templateversions/{templateversion}/presets:
    get:
      tags:
      - Templates
      summary: Get template version presets
      operationId: get-template-version-presets
      parameters:
      - description: Template version ID
        name: templateversion
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/codersdk.Preset'
      security:
      - CoderSessionToken: []
  /api/v2/templateversions/{templateversion}/resources:
    get:
      tags:
      - Templates
      summary: Get resources by template version
      operationId: get-resources-by-template-version
      parameters:
      - description: Template version ID
        name: templateversion
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/codersdk.WorkspaceResource'
      security:
      - CoderSessionToken: []
  /api/v2/templateversions/{templateversion}/rich-parameters:
    get:
      tags:
      - Templates
      summary: Get rich parameters by template version
      operationId: get-rich-parameters-by-template-version
      parameters:
      - description: Template version ID
        name: templateversion
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/codersdk.TemplateVersionParameter'
      security:
      - CoderSessionToken: []
  /api/v2/templateversions/{templateversion}/schema:
    get:
      tags:
      - Templates
      summary: 'Removed: Get schema by template version'
      operationId: removed-get-schema-by-template-version
      parameters:
      - description: Template version ID
        name: templateversion
        in: path
        required: true
        schema:
          type: string
          format: uuid
