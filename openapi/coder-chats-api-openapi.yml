components:
  schemas:
    codersdk.CreateChatRequest:
      type: object
      properties:
        client_type:
          $ref: '#/components/schemas/codersdk.ChatClientType'
        content:
          description: 'Content is the initial user message. It is optional: when

            empty, the chat is created idle with no initial user message

            and generation starts with the first message POSTed to

            /chats/{chat}/messages.'
          type: array
          items:
            $ref: '#/components/schemas/codersdk.ChatInputPart'
        inline_mcp_servers:
          description: 'InlineMCPServers declares MCP servers by value on this chat, next

            to the org-configured servers selected by MCPServerIDs. Experimental.'
          type: array
          items:
            $ref: '#/components/schemas/codersdk.InlineMCPServerRequest'
        labels:
          type: object
          additionalProperties:
            type: string
        mcp_server_ids:
          type: array
          items:
            type: string
            format: uuid
        model_config_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        owner_id:
          description: 'OwnerID makes another user the chat owner. It defaults to the

            caller. The chat runs with the owner''s credentials, so setting it

            requires site-wide authority over that user.'
          type: string
          format: uuid
        plan_mode:
          $ref: '#/components/schemas/codersdk.ChatPlanMode'
        project_id:
          type: string
          format: uuid
        reasoning_effort:
          type: string
        system_prompt:
          type: string
        title:
          description: 'Title, when set, is stored as the user title and automatic title

            generation does not run. It is trimmed and must then be non-empty

            and at most 200 Unicode code points (MaxChatTitleRunes), else the

            request fails with 400. When omitted, the title is derived from the

            first prompt and may later be replaced by a generated title.'
          type: string
        unsafe_dynamic_tools:
          description: 'UnsafeDynamicTools declares client-executed tools that the

            LLM can invoke. This API is highly experimental and highly

            subject to change.'
          type: array
          items:
            $ref: '#/components/schemas/codersdk.DynamicTool'
        workspace_id:
          type: string
          format: uuid
    codersdk.ChatStreamEventType:
      type: string
      enum:
      - message_part
      - message
      - status
      - error
      - queue_update
      - retry
      - action_required
      - preview_reset
      - history_reset
      x-enum-varnames:
      - ChatStreamEventTypeMessagePart
      - ChatStreamEventTypeMessage
      - ChatStreamEventTypeStatus
      - ChatStreamEventTypeError
      - ChatStreamEventTypeQueueUpdate
      - ChatStreamEventTypeRetry
      - ChatStreamEventTypeActionRequired
      - ChatStreamEventTypePreviewReset
      - ChatStreamEventTypeHistoryReset
    codersdk.ChatQueuedMessage:
      type: object
      properties:
        chat_id:
          type: string
          format: uuid
        content:
          type: array
          items:
            $ref: '#/components/schemas/codersdk.ChatMessagePart'
        created_at:
          type: string
          format: date-time
        id:
          type: integer
        model_config_id:
          type: string
          format: uuid
    codersdk.ChatError:
      type: object
      properties:
        detail:
          description: 'Detail is optional provider-specific context shown alongside the

            normalized error message when available.'
          type: string
        kind:
          description: Kind classifies the error for consistent client rendering.
          allOf:
          - $ref: '#/components/schemas/codersdk.ChatErrorKind'
        message:
          description: Message is the normalized, user-facing error message.
          type: string
        provider:
          description: Provider identifies the upstream model provider when known.
          type: string
        retryable:
          description: Retryable reports whether the underlying error is transient.
          type: boolean
        status_code:
          description: StatusCode is the best-effort upstream HTTP status code.
          type: integer
    codersdk.UpdateSkillRequest:
      type: object
      properties:
        content:
          description: 'Content must be SKILL.md-format Markdown with YAML frontmatter. The

            frontmatter must include name, may include description, and must be

            followed by a non-empty body.'
          type: string
        enabled:
          type: boolean
    codersdk.UpdateChatModelRequest:
      type: object
      properties:
        ai_provider_id:
          type: string
          format: uuid
        compression_threshold:
          type: integer
        context_limit:
          type: integer
        display_name:
          type: string
        enabled:
          type: boolean
        is_default:
          type: boolean
        model:
          type: string
        model_config:
          $ref: '#/components/schemas/codersdk.ChatModelCallConfig'
    codersdk.WorkspaceAgentGitServerMessage:
      type: object
      properties:
        message:
          type: string
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/codersdk.WorkspaceAgentRepoChanges'
        scanned_at:
          type: string
          format: date-time
        type:
          $ref: '#/components/schemas/codersdk.WorkspaceAgentGitServerMessageType'
    codersdk.ChatModelOverrideContext:
      type: string
      enum:
      - general
      - explore
      - title_generation
      - compaction
      - advisor
      x-enum-varnames:
      - ChatModelOverrideContextGeneral
      - ChatModelOverrideContextExplore
      - ChatModelOverrideContextTitleGeneration
      - ChatModelOverrideContextCompaction
      - ChatModelOverrideContextAdvisor
    codersdk.UserChatCompactionThresholds:
      type: object
      properties:
        thresholds:
          type: array
          items:
            $ref: '#/components/schemas/codersdk.UserChatCompactionThreshold'
    codersdk.ChatACL:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/codersdk.ChatGroup'
        users:
          type: array
          items:
            $ref: '#/components/schemas/codersdk.ChatUser'
    codersdk.EditChatMessageResponse:
      type: object
      properties:
        deleted_message_ids:
          description: 'DeletedMessageIDs holds the IDs of previously visible messages the

            edit removed, including stale hook notices from the edited turn.

            Clients should drop them from local caches.'
          type: array
          items:
            type: integer
        message:
          $ref: '#/components/schemas/codersdk.ChatMessage'
        messages:
          description: 'Messages holds every user-visible message inserted by the edit, in

            insertion order. Hook-generated suffix messages may follow Message,

            so clients must upsert the full batch.'
          type: array
          items:
            $ref: '#/components/schemas/codersdk.ChatMessage'
        warnings:
          type: array
          items:
            type: string
    codersdk.ChatPersonalModelOverridesAdminSettings:
      type: object
      properties:
        allow_users:
          type: boolean
    codersdk.ChatStatus:
      type: string
      enum:
      - waiting
      - running
      - error
      - requires_action
      - interrupting
      x-enum-varnames:
      - ChatStatusWaiting
      - ChatStatusRunning
      - ChatStatusError
      - ChatStatusRequiresAction
      - ChatStatusInterrupting
    codersdk.UpdateChatPlanModeInstructionsRequest:
      type: object
      properties:
        plan_mode_instructions:
          type: string
    codersdk.Chat:
      type: object
      properties:
        agent_id:
          type: string
          format: uuid
        archived:
          type: boolean
        build_id:
          type: string
          format: uuid
        children:
          description: 'Children holds child (subagent) chats nested under this root

            chat. Always initialized to an empty slice so the JSON field

            is present as []. Child chats cannot create their own

            subagents, so nesting depth is capped at 1 and this slice is

            always empty for child chats.'
          type: array
          items:
            $ref: '#/components/schemas/codersdk.Chat'
        client_type:
          $ref: '#/components/schemas/codersdk.ChatClientType'
        context:
          description: 'Context reports the chat''s pinned workspace-context state and

            whether it has drifted from the agent''s latest pushed snapshot.

            Nil when the chat has no pinned context yet.'
          allOf:
          - $ref: '#/components/schemas/codersdk.ChatContext'
        created_at:
          type: string
          format: date-time
        diff_status:
          description: 'DiffStatus is the primary pull request. It is the ref with the

            most recent git report.'
          allOf:
          - $ref: '#/components/schemas/codersdk.ChatDiffStatus'
        diff_statuses:
          description: 'DiffStatuses lists every ref the chat tracks. The order is

            stable and follows the first report of each ref. DiffStatus

            marks the primary.'
          type: array
          items:
            $ref: '#/components/schemas/codersdk.ChatDiffStatus'
        files:
          type: array
          items:
            $ref: '#/components/schemas/codersdk.ChatFileMetadata'
        has_unread:
          description: 'HasUnread is true when assistant messages exist beyond

            the owner''s read cursor, which updates on stream

            connect and disconnect and via UpdateChatRequest.Read.'
          type: boolean
        id:
          type: string
          format: uuid
        inline_mcp_servers:
          description: 'InlineMCPServers lists the inline MCP servers declared on the chat,

            without headers. Only the single-chat GET sets it.

            Experimental.'
          type: array
          items:
            $ref: '#/components/schemas/codersdk.InlineMCPServer'
        labels:
          type: object
          additionalProperties:
            type: string
        last_error:
          $ref: '#/components/schemas/codersdk.ChatError'
        last_model_config_id:
          type: string
          format: uuid
        last_reasoning_effort:
          type: string
        last_turn_summary:
          type: string
        mcp_server_ids:
          type: array
          items:
            type: string
            format: uuid
        organization_id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        owner_name:
          type: string
        owner_username:
          type: string
        parent_chat_id:
          type: string
          format: uuid
        pin_order:
          type: integer
        plan_mode:
          $ref: '#/components/schemas/codersdk.ChatPlanMode'
        project_id:
          type: string
          format: uuid
        queued_for_capacity:
          description: 'QueuedForCapacity reports that the chat is waiting for a concurrent

            agent slot. Single-chat reads derive it; list responses leave it false.'
          type: boolean
        root_chat_id:
          type: string
          format: uuid
        shared:
          description: Shared is true when this chat's root chat has explicit user or group ACL entries.
          type: boolean
        status:
          $ref: '#/components/schemas/codersdk.ChatStatus'
        summary:
          description: 'Summary is the persisted whole-chat summary, generated in the background.

            It is nil until the first summary has been produced.'
          type: string
        title:
          type: string
        title_source:
          description: 'TitleSource is where Title came from. A title write applies only when

            the current source ranks the same as or lower than the incoming one,

            in the order fallback, generated, user.'
          allOf:
          - $ref: '#/components/schemas/codersdk.ChatTitleSource'
        title_updated_at:
          description: 'TitleUpdatedAt orders title changes. Title writes do not change

            UpdatedAt.'
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        warnings:
          type: array
          items:
            type: string
        workspace_id:
          type: string
          format: uuid
    codersdk.ChatProjectRole:
      type: string
      enum:
      - use
      - admin
      - ''
      x-enum-varnames:
      - ChatProjectRoleUse
      - ChatProjectRoleAdmin
      - ChatProjectRoleDeleted
    codersdk.ChatPlanMode:
      type: string
      enum:
      - plan
      x-enum-varnames:
      - ChatPlanModePlan
    codersdk.ChatStreamStatus:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/codersdk.ChatStatus'
    codersdk.ChatModelAnthropicProviderOptions:
      type: object
      properties:
        allowed_domains:
          type: array
          items:
            type: string
        blocked_domains:
          type: array
          items:
            type: string
        context_1m_enabled:
          type: boolean
        disable_parallel_tool_use:
          type: boolean
        send_reasoning:
          type: boolean
        thinking:
          $ref: '#/components/schemas/codersdk.ChatModelAnthropicThinkingOptions'
        thinking_display:
          type: string
        web_search_enabled:
          type: boolean
    codersdk.ChatPrompt:
      type: object
      properties:
        id:
          type: integer
        text:
          type: string
    codersdk.ChatContextResourceStatus:
      type: string
      enum:
      - ok
      - oversize
      - unreadable
      - invalid
      - excluded
      x-enum-varnames:
      - ChatContextResourceStatusOK
      - ChatContextResourceStatusOversize
      - ChatContextResourceStatusUnreadable
      - ChatContextResourceStatusInvalid
      - ChatContextResourceStatusExcluded
    codersdk.UpdateUserChatDebugLoggingRequest:
      type: object
      properties:
        debug_logging_enabled:
          type: boolean
    codersdk.ChatGroup:
      type: object
      properties:
        avatar_url:
          type: string
          format: uri
        display_name:
          type: string
        id:
          type: string
          format: uuid
        members:
          type: array
          items:
            $ref: '#/components/schemas/codersdk.ReducedUser'
        name:
          type: string
        organization_display_name:
          type: string
        organization_id:
          type: string
          format: uuid
        organization_name:
          type: string
        quota_allowance:
          type: integer
