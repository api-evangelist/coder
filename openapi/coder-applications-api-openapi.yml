openapi: 3.2.0
info:
  description: Coderd is the service created by running coder server. It is a thin API that connects workspaces, provisioners and users. coderd stores its state in Postgres and is the only service that communicates with Postgres.
  title: Coder Applications API
  termsOfService: https://coder.com/legal/terms-of-service
  contact:
    name: API Support
    url: https://coder.com
    email: support@coder.com
  license:
    name: AGPL-3.0
    url: https://github.com/coder/coder/blob/main/LICENSE
  version: '2.0'
servers:
- url: /
tags:
- name: Applications
paths:
  /api/v2/applications/auth-redirect:
    get:
      tags:
      - Applications
      summary: Redirect to URI with encrypted API key
      operationId: redirect-to-uri-with-encrypted-api-key
      parameters:
      - description: Redirect destination
        name: redirect_uri
        in: query
        schema:
          type: string
      responses:
        '307':
          description: Temporary Redirect
      security:
      - CoderSessionToken: []
  /api/v2/applications/host:
    get:
      tags:
      - Applications
      summary: Get applications host
      operationId: get-applications-host
      deprecated: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.AppHostResponse'
      security:
      - CoderSessionToken: []
components:
  schemas:
    codersdk.AppHostResponse:
      type: object
      properties:
        host:
          description: Host is the externally accessible URL for the Coder instance.
          type: string
  securitySchemes:
    AIGatewayKey:
      type: apiKey
      name: X-AI-Governance-Gateway-Key
      in: header
    Authorization:
      type: apiKey
      name: Authorization
      in: header
    CoderSessionToken:
      type: apiKey
      name: Coder-Session-Token
      in: header
