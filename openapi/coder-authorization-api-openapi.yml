openapi: 3.2.0
info:
  description: Coderd is the service created by running coder server. It is a thin API that connects workspaces, provisioners and users. coderd stores its state in Postgres and is the only service that communicates with Postgres.
  title: Coder Authorization API
  termsOfService: https://coder.com/legal/terms-of-service
  contact:
    name: API Support
    url: https://coder.com
    email: support@coder.com
  license:
    name: AGPL-3.0
    url: https://github.com/coder/coder/blob/main/LICENSE
  version: '2.0'
servers:
- url: /
tags:
- name: Authorization
paths:
  /api/v2/auth/scopes:
    get:
      tags:
      - Authorization
      summary: List API key scopes
      operationId: list-api-key-scopes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.ExternalAPIKeyScopes'
  /api/v2/authcheck:
    post:
      tags:
      - Authorization
      summary: Check authorization
      operationId: check-authorization
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.AuthorizationResponse'
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.AuthorizationRequest'
        description: Authorization request
        required: true
  /api/v2/users/login:
    post:
      tags:
      - Authorization
      summary: Log in user
      operationId: log-in-user
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.LoginWithPasswordResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.LoginWithPasswordRequest'
        description: Login request
        required: true
  /api/v2/users/otp/change-password:
    post:
      tags:
      - Authorization
      summary: Change password with a one-time passcode
      operationId: change-password-with-a-one-time-passcode
      responses:
        '204':
          description: No Content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.ChangePasswordWithOneTimePasscodeRequest'
        description: Change password request
        required: true
  /api/v2/users/otp/request:
    post:
      tags:
      - Authorization
      summary: Request one-time passcode
      operationId: request-one-time-passcode
      responses:
        '204':
          description: No Content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.RequestOneTimePasscodeRequest'
        description: One-time passcode request
        required: true
  /api/v2/users/validate-password:
    post:
      tags:
      - Authorization
      summary: Validate user password
      operationId: validate-user-password
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.ValidateUserPasswordResponse'
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.ValidateUserPasswordRequest'
        description: Validate user password request
        required: true
  /api/v2/users/{user}/convert-login:
    post:
      tags:
      - Authorization
      summary: Convert user from password to oauth authentication
      operationId: convert-user-from-password-to-oauth-authentication
      parameters:
      - description: User ID, name, or me
        name: user
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/codersdk.OAuthConversionResponse'
      security:
      - CoderSessionToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/codersdk.ConvertLoginRequest'
        description: Convert request
        required: true
components:
  schemas:
    codersdk.ConvertLoginRequest:
      type: object
      required:
      - password
      - to_type
      properties:
        password:
          type: string
        to_type:
          description: ToType is the login type to convert to.
          allOf:
          - $ref: '#/components/schemas/codersdk.LoginType'
    codersdk.ValidateUserPasswordRequest:
      type: object
      required:
      - password
      properties:
        password:
          type: string
    codersdk.AuthorizationRequest:
      type: object
      properties:
        checks:
          description: 'Checks is a map keyed with an arbitrary string to a permission check.

            The key can be any string that is helpful to the caller, and allows

            multiple permission checks to be run in a single request.

            The key ensures that each permission check has the same key in the

            response.'
          type: object
          additionalProperties:
            $ref: '#/components/schemas/codersdk.AuthorizationCheck'
    codersdk.LoginWithPasswordRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    codersdk.ValidateUserPasswordResponse:
      type: object
      properties:
        details:
          type: string
        valid:
          type: boolean
    codersdk.RBACAction:
      type: string
      enum:
      - application_connect
      - assign
      - create
      - create_agent
      - delete
      - delete_agent
      - read
      - read_personal
      - read_secret
      - ssh
      - share
      - unassign
      - update
      - update_agent
      - update_personal
      - use
      - view_insights
      - start
      - stop
      x-enum-varnames:
      - ActionApplicationConnect
      - ActionAssign
      - ActionCreate
      - ActionCreateAgent
      - ActionDelete
      - ActionDeleteAgent
      - ActionRead
      - ActionReadPersonal
      - ActionReadSecret
      - ActionSSH
      - ActionShare
      - ActionUnassign
      - ActionUpdate
      - ActionUpdateAgent
      - ActionUpdatePersonal
      - ActionUse
      - ActionViewInsights
      - ActionWorkspaceStart
      - ActionWorkspaceStop
    codersdk.AuthorizationCheck:
      description: AuthorizationCheck is used to check if the currently authenticated user (or the specified user) can do a given action to a given set of objects.
      type: object
      properties:
        action:
          enum:
          - create
          - read
          - update
          - delete
          allOf:
          - $ref: '#/components/schemas/codersdk.RBACAction'
        object:
          description: 'Object can represent a "set" of objects, such as: all workspaces in an organization, all workspaces owned by me, and all workspaces across the entire product.

            When defining an object, use the most specific language when possible to

            produce the smallest set. Meaning to set as many fields on ''Object'' as

            you can. Example, if you want to check if you can update all workspaces

            owned by ''me'', try to also add an ''OrganizationID'' to the settings.

            Omitting the ''OrganizationID'' could produce the incorrect value, as

            workspaces have both `user` and `organization` owners.'
          allOf:
          - $ref: '#/components/schemas/codersdk.AuthorizationObject'
    codersdk.LoginWithPasswordResponse:
      type: object
      required:
      - session_token
      properties:
        session_token:
          type: string
    codersdk.ChangePasswordWithOneTimePasscodeRequest:
      type: object
      required:
      - email
      - one_time_passcode
      - password
      properties:
        email:
          type: string
          format: email
        one_time_passcode:
          type: string
        password:
          type: string
    codersdk.AuthorizationResponse:
      type: object
      additionalProperties:
        type: boolean
    codersdk.AuthorizationObject:
      description: 'AuthorizationObject can represent a "set" of objects, such as: all workspaces in an organization, all workspaces owned by me, all workspaces across the entire product.'
      type: object
      properties:
        any_org:
          description: 'AnyOrgOwner (optional) will disregard the org_owner when checking for permissions.

            This cannot be set to true if the OrganizationID is set.'
          type: boolean
        organization_id:
          description: OrganizationID (optional) adds the set constraint to all resources owned by a given organization.
          type: string
        owner_id:
          description: OwnerID (optional) adds the set constraint to all resources owned by a given user.
          type: string
        resource_id:
          description: 'ResourceID (optional) reduces the set to a singular resource. This assigns

            a resource ID to the resource type, eg: a single workspace.

            The rbac library will not fetch the resource from the database, so if you

            are using this option, you should also set the owner ID and organization ID

            if possible. Be as specific as possible using all the fields relevant.'
          type: string
        resource_type:
          description: 'ResourceType is the name of the resource.

            `./coderd/rbac/object.go` has the list of valid resource types.'
          allOf:
          - $ref: '#/components/schemas/codersdk.RBACResource'
    codersdk.ExternalAPIKeyScopes:
      type: object
      properties:
        external:
          type: array
          items:
            $ref: '#/components/schemas/codersdk.APIKeyScope'
    codersdk.OAuthConversionResponse:
      type: object
      properties:
        expires_at:
          type: string
          format: date-time
        state_string:
          type: string
        to_type:
          $ref: '#/components/schemas/codersdk.LoginType'
        user_id:
          type: string
          format: uuid
